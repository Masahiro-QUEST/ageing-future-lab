researchHTML=function(){return `<details class="inline-details" id="research-actions" open><summary>${say('Prioritized validation plan','優先する検証計画')}</summary><div class="details-body">${s4TasksHTML()}</div></details><details class="inline-details" id="upcoming-interviews"><summary>${say('Reconcile the original interview pipeline','前回のインタビュー予定との対応')}</summary><div class="details-body"><p class="small muted">${say('The original nine appointments were recorded as of Oct 15. Matching transcripts now confirm I01/I02/I06. Other elapsed dates do not prove completion; future appointments have not been reconfirmed here.','前回の9件の予定は10月15日時点。I01・I02・I06は今回の議事録と対応します。他は日付の経過で完了にせず、今後の予定も今回再確約したものではありません。')}</p><ul class="interviews">${INTERVIEWS.map(i=>`<li class="interview" id="interview-${i.id}" tabindex="-1"><div class="interview-head"><time>${escapeHTML(formatDate(i.date))}<span class="sr-only">${say('original planned date','前回の予定日')}</span></time><div><h3>${tx(i.name)}</h3><p>${tx(i.focus)}</p>${badge(i.currentState==='completed'?B('Transcript confirms interview','議事録で実施確認'):i.currentState==='notConfirmed'?B('Completion unconfirmed','実施状況は未確認'):B('Scheduled as of Oct 15; not conducted here','10月15日時点の予定・実施未確認'),i.currentState==='completed'?'done':'plan')}${i.id==='I01'?`<p class="small muted">${say('Shown date is the earlier appointment; actual interview date not independently confirmed.','表示日は前回の予定日。実施日は独立確認できていません。')}</p>`:''}${i.caveat?`<p class="warning-text">${tx(i.caveat)}</p>`:''}<div class="link-row">${i.recordId?s4RecordButton(i.recordId):i.nodeIds.map(n=>nodeButton(n)).join('')}</div></div></div></li>`).join('')}</ul><p class="note">${say('The older 4 scheduling/phone and 2 written-questionnaire opportunities remain an unconfirmed historical pipeline. No response or interview has been added solely from those counts.','前回の調整・電話4件、書面質問の機会2件は、未確定の過去記録として保持。これらの件数だけで回答・インタビューを実績に追加していません。')}</p></div></details><details class="inline-details" id="additional-research"><summary>${say('Other research actions retained','保持しているその他の調査行動')}</summary><div class="details-body"><ul class="action-list">${RESEARCH_ACTIONS.map(a=>`<li class="action-item" id="action-${a.id}"><h3>${tx(a.title)}</h3><p>${tx(a.text)}</p><p class="small muted">${tx(a.state)} · ${say('previous record; no additional completion assumed','以前の記録・新たな完了は推定しない')}</p></li>`).join('')}</ul></div></details>`;};
roadmapHTML=function(){const near=['M15','M06','M07'].map(id=>MILESTONES.find(m=>m.id===id));const phases=[['M05',B('Research','調査'),B('Oct–Nov','10〜11月')],['M07',B('Analysis','分析'),B('Ongoing','随時')],['M08',B('Business design','事業設計'),B('Dec 15','12月15日')],['M09',B('Prototype','試作'),B('Jan 15','1月15日')],['M10',B('Testing','テスト'),B('Feb · tentative','2月・暫定')],['M13',B('Iteration','改善・再検証'),B('Mar–Apr','3〜4月')]];return `<section class="section" id="roadmap" aria-labelledby="roadmap-title">${s4Head('08 · VALIDATION & ROADMAP','Next: evidence that can change the decision','次は、判断を変えられる根拠を集める','Activity completion and hypothesis validation are separate measures.','行動の完了と、仮説の検証は別々に扱います。','roadmap-title')}<div class="dates">${near.map((m,i)=>`<button type="button" class="date-card ${i===2?'plan-date':''}" data-milestone="${m.id}"><time>${i===0?say('Oct 28','10月28日'):i===1?say('Nov 11','11月11日'):say('Nov 15','11月15日')}</time><strong>${tx(m.title)}</strong>${badge(UI[m.type],i===2?'':'plan')}<span class="desc">${i===0?say('Planned seminar date','予定日'):i===1?say('School-announced event','学校からの案内日'):say('Tentative project checkpoint','自主計画の暫定期限')}</span></button>`).join('')}</div>${researchHTML()}<h3>${say('Research → analysis → design → prototype → testing → iteration','調査 → 分析 → 事業設計 → 試作 → テスト → 改善')}</h3><div class="phase-path">${phases.map(([id,title,date],i)=>`<button type="button" class="phase-step ${i<2?'current':''}" data-milestone="${id}">${tx(title)}<span>${tx(date)}</span></button>`).join('')}</div><details class="inline-details" id="full-roadmap"><summary>${say('Full roadmap · Sep 2026–Apr 2027 · 15 milestones','全体計画・2026年9月〜2027年4月・15項目')}</summary><div class="details-body">${timelineHTML()}<p class="small muted">${say('School events are labeled separately. February Joint Seminar: exact date TBD. Other intermediate dates are tentative project deadlines. Month positions do not specify exact starts/finishes; no task is completed automatically by date.','学校行事を区別。2月のJoint Seminarは日付未定。その他の中間日は自主計画の暫定期限。月の配置は厳密な開始・終了を示さず、日付で自動完了しません。')}</p></div></details><details class="inline-details" id="decision-log"><summary>${say('Decision log · observation → finding → implication → decision → next action','判断の記録・観察 → 知見 → 示唆 → 判断 → 次の行動')}</summary><div class="details-body">${S4_DECISIONS.map(d=>`<article class="decision-entry"><h3>${d.id} · ${say('Working analysis','暫定的な分析')}</h3><dl class="decision-steps">${[[B('Observation','観察'),d.observation],[B('Finding','知見'),d.finding],[B('Implication','示唆'),d.implication],[B('Decision','判断'),d.decision],[B('Next action','次の行動'),d.next]].map(([l,v])=>`<dt>${tx(l)}</dt><dd>${tx(v)}</dd>`).join('')}</dl><div class="link-row">${d.nodes.map(n=>nodeButton(n)).join('')}</div></article>`).join('')}</div></details><details class="inline-details" id="local-workspace"><summary>${say('Personal notes, backup & short instructions','自分用メモ・バックアップ・簡単な使い方')}</summary><div class="details-body"><label class="workspace-label" for="research-notes">${say('Next appointments / research notes · saved on this device','今後の予定・調査メモ・この端末に保存')}</label><textarea id="research-notes" rows="5" maxlength="20000" placeholder="${say('Write a short next step or date…','次の行動や予定日を簡潔に記録…')}">${escapeHTML(S4_WORK.notes)}</textarea><p class="small" id="workspace-save-status" role="status">${say('No private notes are included in the published source. Avoid confidential details on a shared device.','公開ソースに個人メモは含まれません。共用端末では非公開情報の記入にご注意ください。')}</p><div class="link-row"><button class="btn btn-small" type="button" data-action="s4-export">${say('Export notes & checks (JSON)','メモ・チェックをJSON出力')}</button><button class="btn btn-small" type="button" data-action="s4-import">${say('Import backup','バックアップ読込')}</button><input type="file" id="workspace-import" accept="application/json,.json" hidden></div><ol class="small instructions"><li>${say('Use the top button to switch all prepared content between Japanese and English; the choice persists.','上のボタンで初期コンテンツを日英切替。選んだ言語は保持されます。')}</li><li>${say('Open cards for details; cross-links jump to evidence, a hypothesis or a milestone.','カードを開いて詳細を確認。関連ボタンで根拠・仮説・マイルストーンへ移動できます。')}</li><li>${say('Checks/notes persist after reload. JSON backs up those personal fields, not a shared database. Import merges saved fields.','チェック・メモは再読み込み後も保持。JSONはその個人欄のバックアップで、共有データベースではありません。読込みは保存項目を反映します。')}</li><li>${say('Print/PDF contains both problem trees, all ecosystem views, journey stages and full details, even when collapsed. Personal notes are excluded.','印刷・PDFは、折りたたみ状態にかかわらず、両ツリー・全業界図・全段階・詳細を展開。個人メモは含みません。')}</li><li>${say('For future shared updates, edit the initial JavaScript data by stable IDs and re-publish. Keep source, date, evidence type and unknowns together; do not change a hypothesis to validated simply because an interview happened.','共有資料の更新は、HTMLの初期データを固定IDで編集して再公開します。出典・日付・根拠区分・未確認を併記し、聞き取りの実施だけで検証済みにしません。')}</li></ol></div></details><details class="inline-details" id="work-principles"><summary>${say('Research principles and unmet-need selection','研究の進め方と、未充足ニーズの選び方')}</summary><div class="details-body"><ol>${METHODS.map(m=>`<li>${tx(m)}</li>`).join('')}</ol><dl class="definition">${SELECTION_CRITERIA.map(c=>`<dt>${tx(c.title)}</dt><dd>${tx(c.text)}</dd>`).join('')}</dl></div></details></section>`;};
const s4BaseMilestoneHTML=milestoneHTML;
milestoneHTML=function(m){const extra=S4_TASKS.filter(t=>t.milestone===m.id||m.id==='M07'&&t.nodes.some(n=>n.startsWith('O')));const os=OYAKO.filter(o=>o.milestoneIds.includes(m.id));return s4BaseMilestoneHTML({...m,showInterviews:false,showNodeActivities:false})+`<div class="dialog-content s4-milestone-extra">${os.length?`<h3>${say('Linked solution-validation activities','対応する解決策の検証活動')}</h3>${os.map(o=>`<article><div class="link-row">${nodeButton(o.id)}</div><p>${tx(o.activity)}</p><p class="small muted">${say('Status: unvalidated; activities planned','状態：未検証・活動は計画')}</p></article>`).join('')}`:''}${extra.length?`<h3>${say('Research action links','対応する行動')}</h3><div class="link-row">${extra.map(t=>`<button type="button" class="text-btn" data-task-link="${t.id}">${tx(t.title)}</button>`).join('')}</div>`:''}</div>`;};
footerHTML=function(){return `<footer class="site-footer"><div class="wrap footer-row"><p>Shizenkan MBA · Class of 2027 · Individual Project Seminar<br>${say('Session 4 briefing · checked Oct 22, 2026 · tentative analysis','Session 4資料・2026年10月22日確認・暫定的な分析')}</p><a href="#overview">${say('Back to overview','概要に戻る')} ↑</a></div></footer>`;};
function s4SourcesHTML(){return `<section class="section" id="sources" aria-labelledby="sources-title">${s4Head('09 · SOURCES & SCOPE','Check the source and its date','出典と、情報の時点を確認する','Official terms and private interview summaries play different roles.','制度・商品の公開資料と、非公開議事録の要約は、役割を分けています。','sources-title')}<details class="inline-details" id="source-ledger"><summary>${say('Official source ledger','公式資料の出典一覧')} · ${S4_SOURCES.length}</summary><div class="details-body"><p class="small muted">${say('All links checked Oct 22, 2026. Dates below describe the document version, not a promise that every future contract uses the same terms.','リンク確認日：2026年10月22日。以下の版・時点は、将来のすべての契約条件を保証するものではありません。')}</p><ol class="source-ledger">${S4_SOURCES.map(s=>`<li id="source-${s.id}"><span class="id">${s.id}</span> <a href="${escapeHTML(s.url)}" target="_blank" rel="noopener noreferrer">${tx(s.title)}</a><span>${tx(s.org)} · ${tx(s.version)}</span></li>`).join('')}</ol></div></details><p class="small muted">${say('Interview summaries were reconciled to original transcripts; anonymized paraphrases only. This briefing is research, not an offer of insurance or an individual care assessment. Unconfirmed dates, customer demand and proposed effects are explicitly left open.','聞き取り要約は原議事録と照合し、匿名化した意訳のみ掲載。研究資料であり、保険の募集や個別の介護判断ではありません。未確認の日付・需要・提案の効果は未確認のまま示しています。')}</p></section>`;}
render=function(preserve=false){const opened=preserve?[...document.querySelectorAll('#app details[id]')].map(x=>[x.id,x.open]):[];const y=window.scrollY||0;document.documentElement.lang=language;document.title=raw(B('Family Caregiver Research · Session 4','家族介護者支援の研究 · Session 4'));byId('skip-link').textContent=raw(UI.skip);byId('app').innerHTML=headerHTML()+`<main class="wrap" id="main" tabindex="-1">${overviewHTML()+s4SystemHTML()+s4JourneyHTML()+s4GapsHTML()+findingsHTML()+s4OyakoHTML()+s4CompetitionHTML()+treesHTML()+roadmapHTML()+futureHTML()+questionsHTML()+s4SourcesHTML()}</main>`+footerHTML();opened.forEach(([id,open])=>{const d=byId(id);if(d)d.open=open;});if(state.milestone)byId('milestone-dialog').innerHTML=milestoneHTML(MILESTONES.find(m=>m.id===state.milestone));byId('print-report').innerHTML=buildPrint();if(preserve)window.scrollTo(0,y);};
openNode=function(id){if(!findNode(id))return;closeMilestone(false);s4CloseDetail();if(id.startsWith('O')){const d=byId('node-'+id);d.open=true;revealElement(d.querySelector('summary'));}else if(id.startsWith('S')){byId('vision-details').open=true;const d=byId('node-'+id);d.open=true;revealElement(d.querySelector('summary'));}else{selectTree(id[0]);const d=byId('node-'+id);d.open=true;revealElement(d.querySelector('summary'));}document.querySelectorAll('.selected-node').forEach(x=>x.classList.remove('selected-node'));byId('node-'+id).classList.add('selected-node');announce(id+' · '+raw(findNode(id).title));};
function s4ResetEvidenceView(){if(state.query||state.evidenceFilter!=='all'){state.query='';state.evidenceFilter='all';byId('evidence-search').value='';byId('evidence-filter').value='all';byId('evidence-results').innerHTML=s4EvidenceResults();}}
openFinding=function(id){s4ResetEvidenceView();closeMilestone(false);s4CloseDetail();const card=byId('finding-'+id);if(!card)return;byId('detail-'+id).open=true;revealElement(card);};
function s4OpenRecord(id){s4ResetEvidenceView();closeMilestone(false);s4CloseDetail();byId('interview-records').open=true;const d=byId('record-detail-'+id);if(!d)return;d.open=true;revealElement(d.querySelector('summary'));}
function s4SelectJourney(id,scroll=false){const j=S4_JOURNEY.find(x=>x.id===id);if(!j)return;state.journey=id;document.querySelectorAll('[data-journey]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.journey===id)));byId('journey-content').innerHTML=s4JourneyDetail(j);if(scroll)revealElement(byId('journey-detail'));}
let s4DetailFocus=null;
function s4CloseDetail(){const d=byId('actor-dialog');if(d?.open){d.close();if(s4DetailFocus?.isConnected)s4DetailFocus.focus({preventScroll:true});}}
function s4OpenActor(id,trigger){const a=S4_ACTORS.find(x=>x.id===id);if(!a)return;s4DetailFocus=trigger;const d=byId('actor-dialog');d.innerHTML=`<div class="dialog-head"><h2 id="actor-title">${tx(a.name)}</h2><button class="btn" type="button" data-close-actor>${tx(UI.close)}</button></div><div class="dialog-content"><p>${tx(a.role)}</p>${s4Sources(a.sources)}${a.records?`<div class="link-row">${a.records.map(s4RecordButton).join('')}</div>`:''}</div>`;d.showModal();d.querySelector('button').focus();}
function s4Save(){try{localStorage.setItem(S4_KEY,JSON.stringify({schema:1,tasks:S4_WORK.tasks,notes:S4_WORK.notes}));const el=byId('workspace-save-status');if(el)el.textContent=raw(B('Saved in this browser.','このブラウザに保存しました。'));return true;}catch(_){const el=byId('workspace-save-status');if(el)el.textContent=raw(B('Browser storage unavailable; export JSON to keep a copy.','ブラウザ保存を利用できません。JSONで保存してください。'));announce(raw(B('Storage unavailable. Export a backup.','保存できません。バックアップを出力してください。')));return false;}}
function s4UpdateProgress(){const done=S4_TASKS.filter(t=>s4TaskChecked(t.id)).length;byId('task-count').textContent=done+' / '+S4_TASKS.length;byId('task-progress').value=done;}
function s4Export(){const blob=new Blob([JSON.stringify({schema:1,kind:'volinski-session4-personal-workspace',exportedAt:new Date().toISOString(),tasks:S4_WORK.tasks,notes:S4_WORK.notes},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='session4-notes-and-actions.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1500);announce(raw(B('Backup downloaded.','バックアップを出力しました。')));}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.mapView){state.map=b.dataset.mapView;document.querySelectorAll('[data-map-view]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));byId('system-view').innerHTML=s4SystemView(state.map);}if(b.dataset.actor)s4OpenActor(b.dataset.actor,b);if(b.hasAttribute('data-close-actor'))s4CloseDetail();if(b.dataset.journey)s4SelectJourney(b.dataset.journey);if(b.dataset.journeyLink){closeMilestone(false);s4SelectJourney(b.dataset.journeyLink,true);}if(b.dataset.record)s4OpenRecord(b.dataset.record);if(b.dataset.gap){closeMilestone(false);s4CloseDetail();const d=byId('gap-'+b.dataset.gap);d.open=true;revealElement(d.querySelector('summary'));}if(b.dataset.product){const d=byId('product-'+b.dataset.product);d.open=true;revealElement(d.querySelector('summary'));}if(b.dataset.s4Expand||b.dataset.s4Collapse){const expand=!!b.dataset.s4Expand;byId(b.dataset.s4Expand||b.dataset.s4Collapse).querySelectorAll('details').forEach(d=>d.open=expand);}if(b.dataset.taskLink){closeMilestone(false);byId('research-actions').open=true;revealElement(byId('task-'+b.dataset.taskLink));}if(b.dataset.action==='s4-export')s4Export();if(b.dataset.action==='s4-import')byId('workspace-import').click();});
document.addEventListener('input',e=>{if(e.target.id==='evidence-search'){state.query=e.target.value.slice(0,200);byId('evidence-results').innerHTML=s4EvidenceResults();}if(e.target.id==='research-notes'){S4_WORK.notes=e.target.value;s4Save();}});
document.addEventListener('change',async e=>{if(e.target.id==='evidence-filter'){state.evidenceFilter=e.target.value;byId('evidence-results').innerHTML=s4EvidenceResults();}if(e.target.dataset.taskCheck){S4_WORK.tasks[e.target.dataset.taskCheck]=e.target.checked;s4Save();s4UpdateProgress();}if(e.target.id==='workspace-import'){const f=e.target.files[0];if(!f)return;try{if(f.size>150000)throw new Error('size');const v=JSON.parse(await f.text());if(v.schema!==1||v.kind!=='volinski-session4-personal-workspace'||!v.tasks||typeof v.tasks!=='object'||typeof v.notes!=='string'||v.notes.length>20000)throw new Error('format');for(const [id,done]of Object.entries(v.tasks))if(!S4_TASKS.some(t=>t.id===id)||typeof done!=='boolean')throw new Error('task');Object.assign(S4_WORK.tasks,v.tasks);S4_WORK.notes=v.notes;s4Save();render(true);byId('local-workspace').open=true;byId('workspace-save-status').textContent=raw(B('Backup imported; saved fields restored.','バックアップを読み込み、保存項目を復元しました。'));}catch(_){byId('workspace-save-status').textContent=raw(B('Could not import: choose a valid Session 4 notes/actions backup. Existing data has not changed.','読込できません。有効なSession 4のメモ・行動バックアップを選んでください。既存データは変更していません。'));}e.target.value='';}});
document.addEventListener('keydown',e=>{if(!e.target.matches('[data-map-view],[data-journey]'))return;if(!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Home','End'].includes(e.key))return;const map=e.target.hasAttribute('data-map-view');const group=[...document.querySelectorAll(map?'[data-map-view]':'[data-journey]')];const index=group.indexOf(e.target);const next=e.key==='Home'?0:e.key==='End'?group.length-1:(index+(e.key==='ArrowLeft'||e.key==='ArrowUp'?-1:1)+group.length)%group.length;e.preventDefault();group[next].focus();group[next].click();});

const s4BaseQuestionsHTML=questionsHTML;
questionsHTML=function(){return s4BaseQuestionsHTML().replace('04 ·','DISCUSSION ·').replace(say('Feedback sought on framing, firsthand research, and when to narrow the scope.','課題の捉え方、当事者調査、絞り込むタイミングについて助言を求めたい。'),say('Agree the next decisive test and the evidence needed to choose a business direction.','次に行う重要な検証と、事業の方向を選ぶための根拠を相談します。'));};

</script>
<script>
openRecruitment=function(){closeMilestone(false);s4CloseDetail();byId('research-actions').open=true;revealElement(byId('task-V01'));};
buildPrint=function(){
 const field=(label,value)=>`<div class="print-field"><strong>${tx(label)}</strong><p>${tx(value)}</p></div>`;
 const full=`<header><p class="print-meta">${PROJECT.eyebrow} · ${S4_ASOF}</p><h1>${tx(PROJECT.title)}</h1><p>${tx(UI.meeting)}</p><p class="vision">${tx(PROJECT.vision)}</p></header><h2>${say('Research in brief','研究の要点')}</h2>${PROJECT.narrative.map(n=>field(n.title,n.text)).join('')}<p>${tx(PROJECT.gap)}</p><h2>${say('Care ecosystem: all three views','介護業界：3つの図')}</h2>${['services','money','providers'].map(s4SystemView).join('')}<h2>${say('Caregiver journey: all stages','家族の経路：全段階')}</h2><p>${say('Multiple entry points; not everyone follows this sequence. Rest belongs throughout, and changes can return the family to consultation.','複数の入口があり、全員が同じ順序で進むわけではありません。休息は全段階で考え、変化があれば相談へ戻ります。')}</p>${S4_JOURNEY.map(s4JourneyDetail).join('')}<h2>${say('Possible structural gaps','構造的な課題の可能性')}</h2>${S4_GAPS.map(g=>`<article class="print-block"><h3>${g.id} · ${tx(g.title)}</h3><p>${tx(g.text)}</p>${field(B('Evidence','根拠'),g.evidence)}${field(B('Next test','次の検証'),g.test)}<p>${g.nodes.join(' / ')} · ${g.records.join(' / ')}</p></article>`).join('')}<h2>${say('Interview synthesis and source summaries','聞き取りの統合と原本別要約')}</h2>${FINDINGS.map(f=>`<article class="print-block"><h3>${f.id} · ${tx(f.title)}</h3><p>${tx(f.claim)}</p>${field(UI.evidenceType,f.type)}${field(UI.openQuestion,f.question)}<p class="print-meta">${f.sources.map(id=>{const r=S4_RECORDS.find(x=>x.past===id);return r?r.id:raw(FIELDWORK.find(x=>x.id===id)?.name);}).join(' / ')}</p><p>${tx(f.caveat)}</p></article>`).join('')}${S4_RECORDS.map(r=>`<article class="print-block"><h3>${r.id} · ${s4Date(r)} · ${tx(r.role)}</h3>${field(B('Participant report','聞き取り報告'),r.report)}${field(B('Researcher interpretation','研究者の解釈'),r.implication)}${field(B('Unknown','未確認事項'),r.unknown)}<p class="print-meta">${tx(r.trace)}</p></article>`).join('')}<h2>${say('Oyako solution hypothesis tree','OyakoのSolution Hypothesis Tree')}</h2><p>${say('All three conditions unvalidated. A concept, not a priced or approved product.','3条件すべて未検証。価格・引受けが確定した商品ではなく構想。')}</p>${OYAKO.map(n=>`<article class="print-block"><h3>${n.id} · ${tx(n.title)}</h3>${field(UI.hypothesis,n.claim)}${field(UI.evidence,n.evidence)}${field(B('Unknown','未確認事項'),n.unknown)}${field(UI.activity,n.activity)}${field(UI.gate,n.gate)}<p>${n.problemIds.join(' / ')} · ${n.milestoneIds.join(' / ')}</p>${s4Sources(n.sourceIds)}</article>`).join('')}<h3>${say('¥1m vs ¥10m: research scenarios','100万円と1,000万円：研究用の比較')}</h3><p>${say('These are hypothetical budgets, not a proposed benefit. Use actual all-in service quotes and availability to test what could be obtained, then measure actual use and user-defined life changes. More cash does not automatically create supply, consent or recovery.','商品給付ではなく仮定の予算。実際の総費用と空きを確認して、何を確保できるか比較し、実利用と本人定義の生活変化を測定する。現金が増えても、供給・同意・回復が自動的に生じるわけではない。')}</p><h2>${say('Insurance comparison','保険商品の比較')}</h2><p>${tx(S4_COMP_SUMMARY)}</p><p class="print-note">${say('Checked Oct 22, 2026. Examples have different assumptions; no price ranking. Aflac’s price is historical, Sompo’s is group-specific.','2026年10月22日確認。前提が異なり価格順位ではない。アフラックの価格は過去資料、親子のちからは当該団体限定。')}</p>${S4_PRODUCTS.map(s4ProductDetails).join('')}<h2>${say('The two original Problem Trees','以前からの2本のProblem Tree')}</h2>${TREES.map(t=>`<h3>${t.id} · ${tx(t.title)}</h3><p>${tx(t.root)}</p>${t.nodes.map(n=>`<article class="print-block"><h4>${n.id} · ${tx(n.title)} · ${tx(UI.unvalidated)}</h4>${field(UI.hypothesis,n.claim)}${field(UI.evidence,n.evidence)}${field(UI.questionsLabel,n.question)}${field(UI.activity,n.activity)}${field(UI.target,n.target)}${n.factors?`<ul>${n.factors.map(f=>`<li><strong>${tx(f.title)}</strong> ${tx(f.text)}</li>`).join('')}</ul>`:''}<p>${n.findingIds.join(' / ')} · M07</p></article>`).join('')}<p>${tx(t.boundary)}</p>`).join('')}<h2>${say('Validation actions and roadmap','検証行動と計画')}</h2>${S4_TASKS.map(t=>`<article class="print-block"><h3>${t.id} · ${tx(t.title)}</h3><p>${tx(t.text)}</p><p>${t.nodes.join(' / ')} · ${t.milestone}</p></article>`).join('')}<p class="print-note">${say('Actions are planned; a browser checkbox is not a validation result. Nov 11 is school-announced; Oct 28 is the researcher-supplied planned Session 4 date. Other intermediate deadlines are tentative. February Joint Seminar date is unconfirmed.','行動は計画。ブラウザのチェックは仮説の検証結果ではない。11月11日は学校案内、10月28日は研究者から示されたSession 4予定日。その他の中間期限は暫定。2月Joint Seminarの日付は未確定。')}</p>${MILESTONES.map(m=>`<article class="print-block"><h3>${m.id} · ${tx(m.date)} · ${tx(m.title)}</h3><p class="print-meta">${tx(UI[m.type])} · ${tx(UI[m.status])}</p>${field(UI.goalLabel,m.goal)}${field(UI.activities,m.activities)}${field(UI.deliverable,m.deliverable)}${field(UI.gate,m.gate)}<p>${m.nodeIds.join(' / ')}</p></article>`).join('')}<h2>${say('Decision log: working analysis','判断の記録：暫定的な分析')}</h2>${S4_DECISIONS.map(d=>`<article class="print-block"><h3>${d.id}</h3>${[[B('Observation','観察'),d.observation],[B('Finding','知見'),d.finding],[B('Implication','示唆'),d.implication],[B('Decision','判断'),d.decision],[B('Next action','次の行動'),d.next]].map(([l,v])=>field(l,v)).join('')}</article>`).join('')}<h2>${say('Alternative nature-based respite and earlier vision','自然を活用したレスパイト候補と、以前からの構想')}</h2>${SOLUTIONS.map(n=>`<article class="print-block"><h3>${n.id} · ${tx(n.title)}</h3>${field(UI.hypothesis,n.claim)}${field(UI.activity,n.test)}</article>`).join('')}${SOLUTION_VISION.stages.map(s=>`<article class="print-block"><h3>${tx(s.period)} · ${tx(s.title)}</h3><p>${tx(s.text)}</p></article>`).join('')}<p>${tx(SOLUTION_VISION.unknown)}</p><p>${tx(SOLUTION_VISION.caveat)}</p><p>${tx(SOLUTION_VISION.finance)}</p><h2>${say('Earlier activities and remaining interview pipeline','以前の活動と、残るインタビュー予定')}</h2>${FIELDWORK.filter(f=>!f.recordId).map(f=>`<article class="print-block"><h3>${f.date?escapeHTML(formatDate(f.date)):''} · ${tx(f.name)}</h3><p>${tx(f.focus)}</p></article>`).join('')}${INTERVIEWS.map(i=>`<p><strong>${i.id} · ${escapeHTML(formatDate(i.date))} · ${tx(i.name)}</strong><br>${tx(i.focus)}<br>${say('Original schedule as of Oct 15','10月15日時点の予定')} · ${i.recordId?say('Transcript available: ','議事録あり：')+i.recordId:i.currentState==='notConfirmed'?say('Completion unconfirmed','実施状況未確認'):say('Future schedule not reconfirmed','今後の予定・再確認なし')}</p>`).join('')}<h2>${tx(UI.questions)}</h2>${JEFF_QUESTIONS.map(q=>`<h3>${q.id} · ${tx(q.theme)}</h3><p>${tx(q.question)}</p><p>${tx(q.context)}</p>`).join('')}<h2>${say('Source ledger','出典一覧')}</h2>${S4_SOURCES.map(s=>`<p class="print-source"><strong>${s.id} · ${tx(s.title)}</strong><br>${tx(s.org)} · ${tx(s.version)} · ${say('Checked Oct 22, 2026','確認2026年10月22日')}<br><a href="${escapeHTML(s.url)}">${escapeHTML(s.url)}</a></p>`).join('')}<p class="print-meta">${say('Private interview originals are not published. Personal browser notes and task checks are excluded from this report.','非公開の議事録原本は掲載していません。ブラウザの個人メモ・チェックはこの印刷資料に含めません。')}</p>`;
 const container=document.createElement('div');container.innerHTML=full;
 container.querySelectorAll('details').forEach(d=>d.open=true);
 container.querySelectorAll('button').forEach(b=>{const span=document.createElement('span');span.className='print-link-label';span.innerHTML=b.innerHTML;b.replaceWith(span);});
 container.querySelectorAll('[id],[aria-controls],[aria-labelledby],[aria-pressed], [tabindex]').forEach(el=>{for(const a of ['id','aria-controls','aria-labelledby','aria-pressed','tabindex'])el.removeAttribute(a);});

<script>

const MERGE_SOURCE=B('Researcher-supplied Session 4 handover, received Oct 26, 2026. The Oct 18 faculty summary is described there; the original faculty document was not available for this merge.','研究者提供のSession 4引継ぎ資料（2026年10月26日受領）。10月18日付の教授Summaryへの言及は同資料による。今回、その教授原本は未確認。');
const NEXT_STEPS=[
 {id:'NS1',title:B('A specific task remains unfinished','既存支援の後にも、未完了の作業が残る'),claim:B('Some working adult children have a specific, important care-related task that remains unfinished despite using available support.','働く成人した子どもの一部には、既存支援を利用しても完了できていない重要な介護関連業務がある。'),evidence:B('E08 reports uncertainty about what to ask; E09 reports changing arrangements and difficult service acceptance. These are support-worker reports, not customer task diaries.','E08に相談内容を決められない例、E09に利用変更や受入れの難しさの報告。支援者の報告であり、顧客本人の業務記録ではない。'),unknown:B('Which task, how often, why existing help did not resolve it, and whether it matters to the family.','どの作業が、何度、なぜ残り、本人にとってどれほど重要か。既存窓口だけで解決する例も必要。'),activity:B('Reconstruct the latest unresolved episode with a current family caregiver and map who already handles each step.','現役家族介護者と直近の未解決1件を再現し、各工程の既存の担当者を確認。'),gate:B('Revise the target if existing support already resolves the task or the family does not want additional help.','既存支援で十分に解消する、または追加支援を望まない場合は対象業務を修正。'),recordIds:['E08','E09'],findingIds:['F9','F10'],problemIds:['A2','B2','B3'],milestoneIds:['M15','M06','M07'],sourceIds:[],status:'unvalidated'},
 {id:'NS2',title:B('A useful next action can be clarified','AIと人の整理で、次の行動を具体化できる'),claim:B('AI-assisted organization and human review can produce an accurate, feasible next-action plan from the family’s account and existing public support.','家族の話と既存の公的支援を、AIと人が整理することで、正確で実行可能な次の行動案を作れる。'),evidence:B('E08 motivates helping people articulate a request. No AI-assisted plan has been tested in the supplied material.','E08は相談内容を言語化する支援の必要性を示唆する。提供資料にAIによる行動案のテスト結果はない。'),unknown:B('Missing information, incorrect guidance, local eligibility, accessibility and human review effort.','不足情報、誤案内、地域の利用条件、使いやすさ、人の確認に要する時間。'),activity:B('Draft a plan using dated official sources; a human checks local contacts, scope, eligibility and the family’s preference before it is returned.','日付付きの公式情報から案を作り、地域の窓口・範囲・条件・本人の希望を人が確認して返す。'),gate:B('Do not return an action that cannot be verified; revise or refer to an appropriate professional.','確認できない行動案は返さず、修正または適切な専門窓口につなぐ。'),recordIds:['E08'],findingIds:['F9'],problemIds:['B2','B3'],milestoneIds:['M07'],sourceIds:[],status:'unvalidated'},
 {id:'NS3',title:B('The family acts and progresses','利用者が行動し、解決に向けて進める'),claim:B('The family can act on the reviewed plan and move a specific unresolved task forward.','利用者が確認済みの行動案を実行し、具体的な未完了業務を前に進められる。'),evidence:B('E08 explicitly says post-consultation actions are not tracked. Feeling heard is not evidence of completed action.','E08では相談後の行動を追跡できていない。話して楽になったことは、行動完了の証拠ではない。'),unknown:B('Whether the action is attempted, accepted by the receiving service and completed; reasons for non-action.','着手、窓口での受入れ、完了の有無。動かなかった理由。'),activity:B('Agree a follow-up date; record the planned step, attempted action, outcome and barrier separately.','追跡日を合意し、予定した行動・実際の着手・結果・止まった理由を別々に記録。'),gate:B('If information alone does not lead to action, identify whether emotional, supply, consent or practical support is needed.','情報だけで動けない場合、心理・供給・同意・実務のどこに支援が必要かを見直す。'),recordIds:['E08','E09'],findingIds:['F9'],problemIds:['B3','B5'],milestoneIds:['M06','M07'],sourceIds:[],status:'unvalidated'},
 {id:'NS4',title:B('Net burden actually decreases','家族の正味の時間・調整負担が減る'),claim:B('The service reduces the family’s net time and coordination burden after counting intake, review and follow-up work.','入力・確認・追跡の手間を含めても、利用者の正味の時間・調整負担が減る。'),evidence:B('No before/after time measurement for this concept is supplied. Provider productivity findings do not establish this outcome.','この構想の前後の時間測定は未提供。事業所の生産性に関する知見で、この効果は立証できない。'),unknown:B('Time saved versus time added, task difficulty, repeated effort and user-defined relief.','減った時間と増えた時間、業務の難しさ、手戻り、本人が感じる余裕。'),activity:B('Record baseline and follow-up task time and extra service-use time. Describe plausible alternatives without claiming a causal effect from five cases.','介入前後の作業時間とサービス利用の追加時間を記録。代替手段も整理し、5例から因果効果を断定しない。'),gate:B('If net burden increases or only shifts to another unpaid family member, redesign the process.','正味の負担が増える、別の家族へ移るだけなら、提供方法を修正。'),recordIds:['E09'],findingIds:['F3','F10'],problemIds:['A2','A5'],milestoneIds:['M07'],sourceIds:[],status:'unvalidated'},
 {id:'NS5',title:B('There is value beyond existing options','既存支援と異なる価値が、再利用・支払いにつながる'),claim:B('A defined customer or payer values the service enough to reuse or pay for it compared with existing free and paid options.','特定の利用者または支払者が、既存の無料・有料支援と比べて再利用・支払いを選ぶ価値がある。'),evidence:B('Public consultation, care management and commercial coordination already exist. Current providers also advertise AI guidance and practical assistance.','公的相談、ケアマネジメント、民間の調整支援は既存。AIによる案内や実務支援を掲げる事業者もある。'),unknown:B('Actual choice, willingness to pay after use, payer, repeated need and acquisition cost.','実際の選択、利用後の支払い、支払者、再利用する業務、顧客獲得費。'),activity:B('Compare the same task with public support, Tsukui and Omohibito where applicable. After use, test a realistic paid offer rather than intention alone.','同じ作業を公的支援・ツクイ・想ひ人等と比較。利用後は意向だけでなく、現実的な有料提案への選択を確認。'),gate:B('No demonstrated difference means no differentiation claim. Reconsider the segment, task or partnership.','違いを示せなければ差別化は未検証のまま。対象・作業・提携を再検討。'),recordIds:[],findingIds:['F9'],problemIds:['B3','B4'],milestoneIds:['M06','M07','M08'],sourceIds:['N01','N02'],status:'unvalidated'},
 {id:'NS6',title:B('A small team can deliver reliably','一人・少人数でも、安全と品質を保って提供できる'),claim:B('A small team can deliver consistent, source-checked support with acceptable operating cost and clear referral boundaries.','一人・少人数で、出典確認と適切な専門窓口への接続を保ち、継続できる費用で提供できる。'),evidence:B('No delivery-cost, quality or safety test for this concept is supplied.','この構想の提供費用・品質・安全性のテスト結果は未提供。'),unknown:B('Review time, local updates, corrections, escalation, privacy and variable case complexity.','確認時間、地域情報の更新、誤りの訂正、専門職への接続、個人情報、事例の難易度差。'),activity:B('Record operator time, source checks and corrections for every pilot case. Obtain consent and minimize personal data.','試行ごとに運営時間・出典確認・訂正を記録。同意を得て、必要最小限の情報を扱う。'),gate:B('Pause cases beyond competence or capacity. A five-case pilot is not a safety certification or proof of scale.','対応範囲・余力を超える事例は止める。5例の試行は、安全認証や拡大可能性の証明ではない。'),recordIds:[],findingIds:[],problemIds:['B5'],milestoneIds:['M07','M08'],sourceIds:[],status:'unvalidated'}
];

S4_RECORDS.push(
 {id:'E08',past:'past-yamanashi',date:null,role:B('Family consultation / care-support practitioner · Yamanashi','家族相談・介護支援の実務者・山梨'),scope:B('Professional account of consultation and referral; not a direct customer interview','相談・接続に関する専門職の報告。顧客本人への直接調査ではない'),report:B('Some callers do not know what to ask their care manager, hesitate to raise concerns, or want to be heard rather than request a procedure. Anonymous or out-of-area consultation can matter. The practitioner cannot systematically track what callers do afterwards.','ケアマネジャーに何を相談すればよいか分からない、要望を伝えづらい、手続きより話を聞いてほしいという相談例。匿名・地域外の相談も重要になり得る。相談後の行動は十分に追跡できていない。'),implication:B('Clarifying a request, trust and an appropriate next step may matter alongside information. An AI service is only one untested response.','情報に加え、相談内容の言語化、安心して話せる関係、適切な次の一歩が重要かもしれない。AIサービスが必要かは未検証。'),unknown:B('How common this is, whether the next step is taken, whether existing support suffices, and whether additional help is worth paying for. Interview date is absent from the transcript.','発生割合、次の行動、既存支援で十分か、追加支援への支払意思は未確認。実施日は議事録に記載なし。'),trace:B('Private transcript 06:25–09:57, 12:22–19:13, 32:51–33:37; reviewed Oct 26. Approximate conversational ratios are not used as statistics.','原議事録06:25〜09:57、12:22〜19:13、32:51〜33:37。10月26日照合。その場の概算比率は統計として採用しない。'),nodes:['B2','B3','NS1','NS2','NS3'],findings:['F9']},
 {id:'E09',past:'past-ibaraki',date:null,role:B('Dementia family-support organizer · Ibaraki','認知症の家族支援団体の運営者・茨城'),scope:B('Support-organizer account; condition-specific and not representative of all family caregivers','支援団体運営者の報告。疾患別の経験であり、家族介護者全体の代表ではない'),report:B('Consultations can move from managing symptoms to lack of sleep, personal time, future uncertainty and service acceptance. The organizer also described families who can confidently delegate during day or short-stay care; sudden changes or collection requests create new demands. Online contact does not necessarily resolve everyday coordination.','症状への対応から、睡眠・自分の時間・将来・受入先の悩みへ相談が深まる場合がある。一方、通所・短期入所中は安心して任せられる家族もいるとの印象。突然の迎えや利用変更には対応負担。オンライン交流だけで日々の調整が解消するとは限らない。'),implication:B('Start with a concrete episode and listen for the underlying need. Compare adequate support with unresolved cases rather than assuming nobody can rest.','具体的な1件から、背後のニーズを聞く。全員が休めないと決めつけず、支援が十分な例と不足する例を比べる。'),unknown:B('Frequency, net time effect, what this concept could improve and willingness to pay. Interview date is absent from the transcript.','頻度、正味の時間、今回の構想で改善できること、支払意思は未確認。実施日は議事録に記載なし。'),trace:B('Private transcript 05:53–09:11, 11:15–16:20; reviewed Oct 26. Reports of delegation are not measured recovery outcomes.','原議事録05:53〜09:11、11:15〜16:20。10月26日照合。任せられるという報告は、回復効果の測定ではない。'),nodes:['A2','A5','B3','NS1','NS3','NS4'],findings:['F9','F10']}
);
for(const r of S4_RECORDS.filter(r=>['E08','E09'].includes(r.id)))FIELDWORK.push({id:r.past,date:r.date,category:'interview',state:'professional',name:r.role,focus:r.report,recordId:r.id});

findingsHTML=function(){return `<section class="section" id="findings" aria-labelledby="findings-title">${s4Head('04 · FIELDWORK EVIDENCE','What changed our understanding?','聞き取りで、何が変わったか','Read the synthesis first, then open a source or related hypothesis.','まず横断した知見を見て、必要な原本要約や仮説を開きます。','findings-title')}${s4EvidenceLegend()}<div class="merge-grid"><article><h3>${say('Shared indications','共通する示唆')}</h3><p>${say('Available support does not automatically become usable support. Clear problems, trust, practical fit and sustained use recur across the interviews.','支援の存在だけで利用にはつながらない。課題の明確化、信頼、実務との適合、継続の論点が複数の聞き取りに現れた。')}</p></article><article><h3>${say('Differences and counterexamples','異なる見方・反例')}</h3><p>${say('Some families can already delegate confidently. Listening may itself be the need. More information or an extra action plan is not necessarily the answer.','既存サービスに安心して任せられる家族もいる。傾聴自体がニーズの場合もある。情報や行動案を増やすことが答えとは限らない。')}</p>${s4RecordButton('E09')}${s4RecordButton('E08')}</article></div><p class="merge-legend">${say('These are selected practitioner / operator accounts. They do not measure prevalence, customer willingness to pay or AI effectiveness.','専門職・運営者等から得た選択的な報告。発生割合、顧客の支払意思、AIの効果を測定したものではありません。')}</p><div class="evidence-toolbar"><div><label for="evidence-search">${say('Search evidence in Japanese or English','日英どちらの語でも根拠を検索')}</label><input type="search" id="evidence-search" maxlength="200" value="${escapeHTML(state.query)}" placeholder="${say('consultation, action, privacy…','相談、行動、プライバシー…')}"></div><div><label for="evidence-filter">${say('Show','表示区分')}</label><select id="evidence-filter"><option value="all" ${state.evidenceFilter==='all'?'selected':''}>${say('All','すべて')}</option><option value="findings" ${state.evidenceFilter==='findings'?'selected':''}>${say('Findings','統合した知見')}</option><option value="records" ${state.evidenceFilter==='records'?'selected':''}>${say('Transcript records','実施済み議事録')}</option></select></div></div><div id="evidence-results">${s4EvidenceResults()}</div><details class="inline-details" id="merge-source-map"><summary>${say('Source reconciliation and limits','原本の対応と限界')}</summary><div class="details-body"><p>${say('All seven previous records remain. The handover’s I06 and I07 map to new E08 and E09. Its I04/I05 map to retained E06/E05. The earlier municipal E04 remains even though omitted from the handover. Interview dates were not inferred from upload dates.','既存7件を保持。引継ぎのI06・I07は新しいE08・E09、I04・I05は既存E06・E05へ対応。引継ぎにない自治体E04も保持。アップロード日から実施日を推測していません。')}</p><p>${say('Home-care practitioner qualifications and the nature operator’s name remain unconfirmed. Sibling / young-carer support is adjacent evidence, not a sample of adult children caring for older parents.','在宅介護の実務者の資格・自然体験運営者の氏名の不確実性を保持。きょうだい・ヤングケアラー支援は隣接情報であり、高齢の親を介護する成人子の標本ではありません。')}</p></div></details><details class="inline-details"><summary>${say('Keep provider improvement separate from family outcomes','事業所の改善と、家族の成果を分ける')}</summary><div class="details-body"><p>${say('Oita, Osaka and Yamagata inform the implementation context. Whether these changes free family time or improve recovery needs direct family-level evidence.','大分・大阪・山形は運用定着の背景を示す。家族の時間や回復にどうつながるかは、家族単位の直接根拠が必要。')}</p></div></details></section>`;};

function mergeNextTreeHTML(){return `<section class="section" id="next-step-tree" aria-labelledby="next-step-title">${s4Head('05B · SOLUTION HYPOTHESIS TREE','Next Step for Care: what must be true?','介護の次の一手が成立するには','A new independent-startup hypothesis, not a solution assigned by Jeff or a selected business.','Session 3後に検討した個人起業の候補。Jeff教授の指定解決策や、選択済み事業ではありません。','next-step-title')}<div class="tree-root solution-root"><div class="field-label">${say('Target: working adult children caring for an older parent','対象：働きながら高齢の親を支える成人した子ども')}</div><h3>${say('Clarifying one next action helps families complete an unresolved task and gain practical relief.','次の行動を具体化することで、未完了業務が進み、家族の負担が減る。')}</h3><p>${say('AI + existing support + human review is a proposed method. All six conditions remain unvalidated.','AI＋既存支援＋人による確認は方法の案です。6条件はすべて未検証。')}</p></div><div class="tree-toolbar"><span class="context">${say('Need → plan → action → outcome → value → delivery','未充足→行動案→実行→成果→価値→提供')}</span><button class="btn btn-small" type="button" data-s4-expand="next-branches">${tx(UI.expand)}</button><button class="btn btn-small" type="button" data-s4-collapse="next-branches">${tx(UI.collapse)}</button></div><div class="solution-branches" id="next-branches">${NEXT_STEPS.map(s4OyakoNode).join('')}</div><div class="merge-counter"><h3>${say('The test can show that no new service is needed','新しいサービスが不要だと分かる結果も大切')}</h3><p>${say('If existing support resolves the task, the person wants listening rather than action, or the plan adds more work than it saves, revise the concept. “AI tells the next step” alone is not a demonstrated differentiator.','既存支援で解決する、行動より傾聴を求める、減る時間より手間が増える場合は構想を修正。「AIが次を教える」だけで差別化できたとは扱いません。')}</p><a href="#experiments">${say('See the proposed pilot','次の試行案を見る')} →</a></div></section>`;}

function mergeExperimentsHTML(){return `<section class="section" id="experiments" aria-labelledby="experiments-title">${s4Head('07B · EVIDENCE GAP → EXPERIMENT','A small test that can change the idea','構想を変えられる、小さな検証','Start with one real unresolved task. About five cases is an exploratory target, not a representative survey.','実際の未解決1件から。5人程度は探索の目標で、代表性のある調査ではありません。','experiments-title')}<div class="merge-status"><span class="badge badge-plan">${say('Proposed protocol','実験計画案')}</span><span class="badge">${say('Recruitment status: not supplied','募集状況：未提供')}</span><span class="badge">${say('Results registered: 0','結果登録：0件')}</span></div><p class="note">${say('Recruit current adult-child caregivers with varied living arrangements, care duration, employment and service use. Include families already well supported. Session 4 does not require five completed tests.','同居・遠距離、介護期間、就労、サービス利用の異なる現役成人子を募集。既存支援で十分な例も含める。Session 4までの5人の完了は必須にしません。')}</p><ol class="experiment-flow">${[

 [B('Make a reviewed plan','確認済みの行動案を作る'),B('Use relevant official information; a human verifies conditions, contacts and the family’s wishes.','適切な公式情報を使い、条件・窓口・希望を人が確認。')],
 [B('Let the person choose','本人が選び、行動する'),B('The family chooses whether to act. Record non-action without treating it as a failure of the person.','実行するかは本人が選ぶ。非実行を本人の失敗にしない。')],

const S27_STAGES=[
 {id:'awareness',n:1,title:B('Awareness','気づく'),state:B('I may not see myself as a caregiver, or recognize my own burden.','自分が介護者なのか、支援が必要なのか気づいていない。'),support:B('Create a gentle opportunity to notice needs, before a crisis.','危機の前から、負担や支援に気づく接点を作る。'),tools:B('Employers, local groups, SNS and optional events.','勤務先・地域・SNS・参加を選べるイベント。'),views:{caregiver:B('“It is just what families do.” My own needs can remain invisible.','「家族なら当たり前」。自分の負担が見えない。'),stakeholder:B('Employers, local groups and families can offer low-pressure contact.','勤務先・地域・家族が、押し付けない接点を作る。'),ai:B('Proposed: accessible content and optional self-reflection prompts.','構想：読みやすい情報発信と、任意のセルフチェック。')},evidence:B('E10: the young-carer practitioner described people for whom caring is normal and outreach beyond a website.','E10：ケアが日常となる人、ホームページだけに頼らない働きかけの実践が語られた。'),interpretation:B('Information availability does not guarantee recognition or contact.','情報を置くだけでは、気づきや相談につながらない可能性。'),hypothesis:B('Some adult-child caregivers also do not recognize a need for support.','成人した子どもにも、支援の必要性に気づかない層がいる。'),test:B('Ask current adult carers how they first recognized a problem; compare people reached through work/community with existing users. Do not label people against their wishes.','現役介護者に最初の気づきと接点を聞く。勤務先・地域経由と既存利用者を比較し、本人の意思に反して介護者と決めつけない。'),actors:B('Employers / HR, municipalities, families, local communities.','企業・人事、自治体、家族、地域コミュニティ。'),ai:B('Candidate tools: source-checked content drafts, plain-language summaries and optional self-checks. No diagnostic classification or deployed Lab service.','候補：出典確認付きの発信原稿、平易な説明、任意の振り返り。診断や、実装済みのLabサービスではない。'),nodes:['B1','NS1'],records:['E10','E08'],outcome:B('People whose recognition of their own burden or available support changes.','自分の負担や支援に対する認識が変化した人。'),measure:B('With consent, before/after self-report among participants answering both; report the denominator and positive/negative/no change.','同意のもと、前後とも回答した参加者の自己評価。分母と改善・悪化・変化なしを併記。')},
 {id:'trust',n:2,title:B('Trust','つながる'),state:B('I do not know whom to talk to, or feel hesitant to ask.','誰に話せばよいか分からず、相談することに抵抗がある。'),support:B('Offer a safe, low-pressure relationship and a choice of contact.','安心して話せる相手と、接点を選べる関係を作る。'),tools:B('Family groups, carers’ cafés, counselors and community contacts.','家族会・ケアラーズカフェ・相談員・地域の接点。'),views:{caregiver:B('I need someone I can trust, without pressure to buy or disclose.','売り込みや開示の圧力なく、安心して話したい。'),stakeholder:B('Family groups, counselors and community contacts build relationships.','家族会・相談員・地域が、平時から関係を育てる。'),ai:B('Proposed: help find a human contact; minimize identifiable data.','構想：人につながる窓口案内と、個人情報を抑えた整理。')},evidence:B('E10: relationships before a crisis and approachable places were emphasized. E08 also describes reluctance to raise concerns.','E10：危機の前の関係性、入りやすい場を重視。E08にも相談のためらいの報告。'),interpretation:B('A trusted relationship may matter before a formal service request.','正式な依頼の前から、信頼関係が重要かもしれない。'),hypothesis:B('An opt-in, trusted contact increases adult carers’ willingness to seek support.','任意に関われる信頼できる接点が、成人介護者の相談を後押しする。'),test:B('Ask what made the first conversation possible and what discouraged it. Observe opt-in participation; attendance is not proof of burden reduction.','最初に話せた理由・話せなかった理由を聞き、任意参加を観察。参加だけで負担軽減と判定しない。'),actors:B('Family associations, carers’ cafés, counselors, community groups, HR.','家族会、ケアラーズカフェ、相談員、地域団体、人事。'),ai:B('Candidate: anonymous issue organization and contact options, with explicit consent for any onward sharing. Trust in an AI is not assumed.','候補：匿名性に配慮した整理と窓口の選択肢。外部共有は別途同意。AIが信頼されるとは決めつけない。'),nodes:['B2','NS1'],records:['E10','E08'],outcome:B('People joining a first consultation or exchange by choice.','自ら希望して、初めて相談や交流に参加した人。'),measure:B('Opt-in first participation / people invited through the pilot; record non-participation without treating it as failure.','試行で案内した人数を分母に、希望による初回参加を記録。不参加の意思を失敗と扱わない。')},
 {id:'understanding',n:3,title:B('Understanding','整理する'),state:B('I have a vague worry but cannot explain what I need.','困りごとが漠然としていて、何が必要か説明できない。'),support:B('Listen, put concerns into words and agree priorities.','まず話を聞き、困りごとを言葉にして優先順位を合意する。'),tools:B('Human dialogue; optional AI support for organizing the account.','人による対話。希望があればAIによる整理補助。'),views:{caregiver:B('I want to be heard before someone tells me what to do.','解決策を勧められる前に、まず話を聞いてほしい。'),stakeholder:B('Counselors and care professionals clarify wishes and priorities.','相談員・専門職が、本人の希望と優先事項を整理する。'),ai:B('Proposed: classify concerns, summarize and prepare questions for review.','構想：悩みの分類、要約、相談したい質問の下書き。')},evidence:B('E10: talking can help a person notice their own feelings; sometimes listening is what they want. E08/E09 also reveal needs through conversation.','E10：話すことで自分の思いに気づき、傾聴だけを望む場合もある。E08・E09にも対話から深まるニーズ。'),interpretation:B('Problem clarification and feeling heard may have value in their own right.','問題の整理や、聞いてもらうこと自体にも価値があり得る。'),hypothesis:B('Listening-first support helps adult carers clarify what matters, with or without an additional service.','傾聴から始める支援が、追加サービスの有無にかかわらず、成人介護者の優先事項を明確にする。'),test:B('Compare the person’s initial concern with the summary they approve. Ask whether they want action, listening only or no further contact.','最初の悩みと、本人が確認した整理内容を比較。行動・傾聴のみ・追加連絡なしの希望を確認。'),actors:B('Counselors, community support centers, care managers, family groups.','相談員、地域包括支援センター、ケアマネジャー、家族会。'),ai:B('Candidate: redact identifiers, organize issues and draft a summary. A person checks meaning, consent and local facts; AI does not prescribe a care plan.','候補：識別情報を抑え、悩みを分類し要約を作る。意味・同意・地域情報を人が確認し、AIがケアプランを決めない。'),nodes:['B2','NS2'],records:['E10','E08','E09'],outcome:B('People able to specify a priority concern and acceptable options.','優先する課題と、納得できる選択肢を具体化できた人。'),measure:B('Participant-confirmed concern/options / consenting conversations, including “listening only” or “no additional support” as valid preferences.','同意した対話を分母に、本人が確認した課題・選択肢を記録。傾聴のみ・追加支援不要も正当な希望。')},
 {id:'action',n:4,title:B('Action','動く'),state:B('I understand the next step but find it hard to carry out.','次にすることが分かっても、実行が難しい。'),support:B('Identify a contact, compare options, prepare communication and help arrange.','相談先を特定し、比較・連絡準備・必要な手配を助ける。'),tools:B('Existing care services, public programs and a proposed AI assistant.','既存の介護サービス・公的制度。AI補助は構想。'),views:{caregiver:B('The calls, comparisons and arrangements still feel hard.','電話・比較・手配の作業が、まだ難しい。'),stakeholder:B('Care managers, providers and public services already help arrange care.','ケアマネ・事業所・公的窓口の既存の調整支援を使う。'),ai:B('Proposed: verify options, draft contact messages and plan a next step.','構想：選択肢の照合、連絡文の下書き、行動案づくり。')},evidence:B('E10: check the person’s wishes and existing resources first. E08 reports that subsequent actions are not systematically tracked.','E10：希望と既存資源を先に確認。E08では、その後の行動を十分に追跡できていない。'),interpretation:B('A referral and a completed action are different; some tasks may still need practical help.','紹介と行動完了は別で、実務支援が必要な作業が残るかもしれない。'),hypothesis:B('Additional help completes a specific adult-carer task better than existing help alone, without adding net burden.','追加支援が、既存支援だけより具体的な業務を進め、正味負担を増やさない。'),test:B('For one recent unfinished task, map existing support, agree a reviewed plan and record attempt, completion, time and receiving-service acceptance.','直近の未完了1件で既存支援を整理。確認済み案を合意し、着手・完了・時間・受入先の対応を記録。'),actors:B('Care managers, care providers, community centers, private services; the person chooses.','ケアマネ、介護事業所、地域包括、民間サービス。選ぶのは本人。'),ai:B('Candidate: source-dated search, comparison and email drafts. No automatic enrollment, payment or sharing; verify scope and costs with the actual service.','候補：日付付き情報検索、比較、連絡文案。申込・支払・共有を自動で行わず、実際の窓口で条件・費用を確認。'),nodes:['NS3','NS4','NS5'],records:['E10','E08','E09'],outcome:B('People completing an agreed, wanted consultation or service-use action.','本人が望み合意した相談・サービス利用等の行動を完了した人。'),measure:B('Completed actions / agreed actions by the chosen follow-up date; distinguish attempt, refusal, unavailable supply and completion.','合意した追跡日までの完了数／合意した行動数。着手・希望変更・供給不足・完了を区別。')},
 {id:'followup',n:5,title:B('Follow-up','続ける'),state:B('After an initial step, the problem can persist or change.','一度相談・行動しても、課題が残ったり変化したりする。'),support:B('Check progress by agreement and adjust the support when needed.','合意した範囲で進み具合を確かめ、必要なら支援を見直す。'),tools:B('Consented follow-up, reminders and coordination with existing supporters.','同意に基づく継続確認、リマインド、既存支援者との連携。'),views:{caregiver:B('My situation changes; I want support that can be adjusted.','状況は変わる。必要に応じて相談し直したい。'),stakeholder:B('Existing supporters and the family agree who follows up and when.','既存支援者と家族で、追跡する相手・時期を合意する。'),ai:B('Proposed: opt-in reminders, task tracking and outcome analysis.','構想：任意の通知、進捗記録、効果の振り返り。')},evidence:B('E08 lacks systematic action follow-up; E09 describes unexpected pickups and changes. E10 motivates relationships before problems deepen.','E08に行動追跡の不足、E09に急な迎え・変更の報告。E10は深刻化前の関係づくりを示唆。'),interpretation:B('A one-off contact may not show whether daily life improves.','1回の接点だけでは、生活が改善したか分からない。'),hypothesis:B('Proportionate, consented follow-up detects unmet tasks and helps adult carers sustain meaningful progress.','過度にならない同意付きの継続確認が、成人介護者の残る作業と意味ある進展を支える。'),test:B('Agree a follow-up interval; compare baseline and follow-up burden including time spent on the service. Record stop requests and other explanations.','追跡間隔を合意し、利用の追加時間も含め負担を前後で比較。連絡停止の希望と他の変化要因も記録。'),actors:B('Care managers, providers, local support, family; any Lab role is proposed.','ケアマネ、事業所、地域の支援、家族。Labの役割は構想。'),ai:B('Candidate: reminders only by consent, task records and aggregated analysis. No claim of measured benefit or integrated partner systems.','候補：同意付き通知、作業記録、集計分析。効果実績や、提携先システムとの接続はまだない。'),nodes:['NS3','NS4','NS6','B5'],records:['E08','E09','E10'],outcome:B('People sustaining wanted support with a reported reduction in burden.','望む支援を継続でき、負担軽減を確認できた人。'),measure:B('Followed participants reporting lower burden / participants with both time points. Record attrition and time added; before/after is not causal proof.','前後とも測定できた人を分母に負担軽減を記録。脱落と追加時間を併記。前後比較だけで因果を立証しない。')}

function s27EvidenceChain(s){return `<div class="s27-evidence-chain"><div><h4 class="s27-proof">${say('INTERVIEW INSIGHT','聞き取りの示唆')}</h4><p>${tx(s.evidence)}</p></div><div><h4 class="s27-proof">${say('RESEARCH INTERPRETATION','研究者の解釈')}</h4><p>${tx(s.interpretation)}</p></div><div><h4 class="s27-proof hypothesis">${say('NEW HYPOTHESIS · UNTESTED','新しい仮説・未検証')}</h4><p>${tx(s.hypothesis)}</p></div></div>`;}
function s27StageDetail(s,context){return `<article class="s27-stage-detail" id="${context}-stage-${s.id}" tabindex="-1"><h3>${s.n}. ${tx(s.title)} ${badge(UI.unvalidated)}</h3><div class="s27-detail-grid">${s4Field('Caregiver state','介護者の状態',s.state)}${s4Field('Support needed','必要な支援',s.support)}${s4Field('Possible means','支援手段の候補',s.tools)}${s4Field('People who may help','関わり得る人',s.actors)}</div>${s27EvidenceChain(s)}${s4Field('Next validation','次に確かめること',s.test)}<details class="inline-details" id="${context}-ai-${s.id}"><summary>${say('AI opportunity · proposed, not deployed','AIの補完可能性・構想段階')}</summary><div class="details-body"><p>${tx(s.ai)}</p></div></details><div class="link-row">${s.records.map(s4RecordButton).join('')}${s.nodes.map(nodeButton).join('')}</div></article>`;}
function s27LoopHTML(context){return `<div class="s27-loopbar"><p><strong>${say('Return, pause or stop by choice','戻る・休む・終えることも、本人が選ぶ')}</strong></p><div class="s27-looplinks"><button type="button" data-s27-return="understanding" data-s27-context="${context}">${say('Action ↩ Understanding','動く ↩ 整理する')}</button><button type="button" data-s27-return="action" data-s27-context="${context}">${say('Follow-up ↩ Action','続ける ↩ 動く')}</button><button type="button" data-s27-return="understanding" data-s27-context="${context}">${say('Follow-up ↩ Understanding','続ける ↩ 整理する')}</button></div><p class="s27-consent">${say('Listening alone can be enough. Additional services are optional; respect a wish to decline or stop. Enter at any stage. This is a proposed support model, not a sales funnel.','傾聴だけで十分な場合もある。追加サービスは任意で、断る・終える意思を尊重する。どの段階から入ってもよい。販売へ誘導する図ではなく、支援モデルの案。')}</p></div>`;}
function s27ModelHTML(context){const details=S27.allStages?S27_STAGES:(S27.stageOpen?S27_STAGES.filter(s=>s.id===S27.stage):[]);return `<div class="s27-model"><div class="s27-model-intro"><span class="s27-status">${say('Researcher-proposed · unvalidated','研究者のモデル案・未検証')}</span><p>${say('Select a stage to inspect evidence and the next test.','各段階を押すと、根拠と検証課題が開きます。')}</p></div><div id="${context}-layer-content" role="tabpanel" aria-labelledby="${context}-tab-${S27.layer}"><ol class="s27-stage-track">${S27_STAGES.map(s=>`<li><button class="s27-stage-card" type="button" data-s27-stage="${s.id}" data-s27-context="${context}" aria-expanded="${Boolean((S27.stageOpen&&S27.stage===s.id)||S27.allStages)}" aria-controls="${context}-stage-details"><span class="s27-stage-top"><span class="s27-stage-number">${s.n}</span>${s27Icon(s.id)}</span><span class="s27-stage-title">${tx(s.title)}</span>${language==='ja'?`<span class="s27-stage-en" lang="en">${escapeHTML(s.title.en)}</span>`:''}<span class="s27-stage-body">${tx(s.views[S27.layer])}</span><span class="s27-stage-more">${say('Evidence & next test','根拠・検証を見る')} ${((S27.stageOpen&&S27.stage===s.id)||S27.allStages)?'−':'+'}</span></button></li>`).join('')}</ol></div><div class="s27-layer-tabs" role="tablist" aria-label="${say('Support model perspective','支援モデルの視点')}">${S27_VIEWS.map(v=>`<button id="${context}-tab-${v.id}" class="btn btn-small" type="button" role="tab" tabindex="${S27.layer===v.id?'0':'-1'}" aria-selected="${S27.layer===v.id}" aria-controls="${context}-layer-content" data-s27-layer="${v.id}" data-s27-context="${context}">${tx(v.label)}</button>`).join('')}</div><p class="s27-layer-note">${S27.layer==='ai'?say('All Lab functions here are proposals; AI tools elsewhere exist, but their benefit and integration here are untested.','ここに示すLab機能はすべて構想。他社のAI機能は既存ですが、本構想への効果・連携は未検証。'):say('The same structure, viewed from another perspective. Roles shown do not establish a Lab partnership.','同じ5段階を別の視点で表示。関係者の役割を示すもので、Labとの提携実績ではありません。')}</p>${s27LoopHTML(context)}<div id="${context}-stage-details" ${details.length?'':'hidden'}>${details.map(s=>s27StageDetail(s,context)).join('')}</div>${context==='r'?`<div class="s27-links"><button type="button" class="btn btn-small" data-s27-expand="true">${say('Expand all stages','全段階の詳細を展開')}</button><button type="button" class="btn btn-small" data-s27-expand="false">${say('Collapse stage details','段階の詳細を折りたたむ')}</button>${nodeButton('NS1')}${nodeButton('NS5')}${milestoneButton('M07')}</div>`:''}</div>`;}
function s27CaseHTML(context){return `<details class="inline-details" id="${context}-hokkaido-case"><summary>${say('Hokkaido case study · scope and source','北海道の事例・内容と根拠の範囲')}</summary><div class="details-body"><h3>${say('Hokkaido Young Carer Consultation Support Center','北海道ヤングケアラー相談サポートセンター')}</h3><p class="s27-scope">E10 · 2026-10-27 · ${say('Date supplied by researcher. Original transcript reviewed; anonymized paraphrase. Mainly young-carer support.','実施日は研究者提供。原議事録を照合した匿名の要約。主にヤングケアラー支援。')}</p><ul class="s27-case-list"><li>${say('Caring can feel normal; a person may not recognize their own burden.','ケアが当たり前になり、自分の負担に気づいていないことがある。')}</li><li>${say('Listening can help a person notice feelings and concerns; sometimes listening is the wanted support.','話すことで気持ちや問題を整理でき、傾聴だけを望む場合もある。')}</li><li>${say('Build relationships before crisis; do not rely on a website alone.','危機の前から関係を作り、ホームページだけに頼らない。')}</li><li>${say('School outreach and accessible places can create contact. Local, educational, public and private cooperation was discussed as a possible route to wider support.','学校への働きかけや入りやすい場が接点になる。地域・教育・行政・民間との関わりによる広がりが語られた。')}</li><li>${say('Confirm wishes and existing resources before inventing a service.','新しい仕組みを作る前に、本人の希望と既存の資源を確認する。')}</li></ul><p class="note">${say('Earlier elder-care work was also described; that experience is distinct from the center’s current young-carer practice. Adult-child applicability, prevalence, causal impact and payment remain untested.','過去の高齢者介護業務の経験も語られたが、現在のヤングケアラー支援と区別する。成人子への適用・頻度・因果的な効果・支払いは未検証。')}</p><p class="s27-scope">${say('Detailed school activity counts and named commercial collaborations are omitted pending confirmation of accuracy and public reuse. Interview participation does not imply endorsement or partnership.','学校数・企業名を含む活動の詳細は、正確さと外部公表可否の確認前につき省略。聞き取りへの協力は、推奨や提携を意味しない。')}</p><div class="link-row">${s4RecordButton('E10')}${nodeButton('B1')}${nodeButton('NS2')}</div></div></details>`;}
function s27SupportSection(){return `<section class="section" id="support-model" aria-labelledby="support-model-title">${s4Head('00B · FROM AWARENESS TO ACTION','A support model with room to listen, return and stop','気づきから行動へ — 家族介護者のための支援モデル','A synthesis to test with adult caregivers, informed by Hokkaido and other support-practitioner accounts.','北海道などの支援者の話をもとに、成人介護者へ確かめる研究者のモデル案。','support-model-title')}<p class="prose">${tx(S27_MESSAGE)}</p>${s27ModelHTML('r')}${s27CaseHTML('r')}</section>`;}
function s27ChannelsHTML(){return `<details class="inline-details" id="insurance-channels"><summary>${say('How do insurance competitors reach customers? · checked Oct 27','競合保険は、どの経路で顧客に届くか・10月27日確認')}</summary><div class="details-body"><div class="s27-table-wrap"><table class="s27-evidence-table"><caption>${say('Confirmed route vs remaining uncertainty','確認した経路と、まだ確認できないこと')}</caption><thead><tr><th>${say('Product','商品')}</th><th>${say('Sales route','販売経路')}</th><th>${say('What this does not establish','未確認の範囲')}</th></tr></thead><tbody>${S27_CHANNELS.map(c=>`<tr><td><strong>${tx(c.name)}</strong></td><td>${tx(c.route)}${s4Sources(c.sources)}</td><td>${tx(c.boundary)}</td></tr>`).join('')}</tbody></table></div><p class="note">${say('Oyako needs a credible route to adult children before care, not only a new benefit design. Trust, actual customer access and acquisition cost are unvalidated. These channel checks do not refresh every product price or term; retain the original dates shown above.','Oyakoには給付設計だけでなく、介護前の成人子へ届く経路が必要。信頼、実際の接点、獲得費は未検証。この経路確認を全商品の料金・条件の更新とはせず、各条件の元の確認日を保持。')}</p></div></details>`;}
function s27PayerHTML(compact=false){return `<div class="s27-table-wrap"><table class="s27-evidence-table"><caption>${say('Who pays? · four hypotheses, none confirmed','誰が払うか・4つとも検証前の仮説')}</caption><thead><tr><th scope="col">${say('Model / payer','モデル・支払者')}</th><th scope="col">${say('Value hypothesis','支払う理由の仮説')}</th>${compact?'':`<th scope="col">${say('Unverified / next test','未確認事項・検証')}</th>`}</tr></thead><tbody>${S27_PAYERS.map(p=>`<tr><td><strong>${p.model}</strong><br>${tx(p.payer)}</td><td>${tx(p.value)}</td>${compact?'':`<td>${tx(p.gap)}<br><strong>${say('Test: ','検証：')}</strong>${tx(p.test)}</td>`}</tr>`).join('')}</tbody></table></div>`;}
function s27BusinessSection(){return `<section class="section" id="payer-hypotheses" aria-labelledby="payer-title">${s4Head('05C · WHO PAYS?','An unfinished task, a real alternative, a possible payer','残る1業務・既存の代替手段・支払者を比べる','Engineering, speed and AI are capabilities. They do not by themselves establish competitive advantage.','開発力・速度・AI活用は能力であり、そのまま競争優位の証明にはなりません。','payer-title')}${s27PayerHTML()}<details class="inline-details" id="differentiation-test"><summary>${say('What would genuinely be new?','何が本当に新しいのか')}</summary><div class="details-body"><p>${say('Unverified candidate: help a precisely defined group complete an important task that remains after existing support, with less net burden and viable small-team delivery. “Uses AI” and “offers follow-up” are not differentiation claims.','未検証の候補価値は、既存支援の後にも残る重要な1業務を、特定の層がより少ない正味負担で完了でき、少人数で提供を続けられること。「AIを使う」「継続確認がある」だけで差別化とはしない。')}</p><ul><li>${say('Compare public consultation and care management: what do they already handle, and where do their scope and availability end?','公的相談・ケアマネジメントと比較：既に何を担い、範囲・利用可能性のどこに限界があるか。')}</li><li>${say('Compare Tsukui and Omohibito: practical assistance and AI guidance already exist. Test the same task and conditions.','ツクイ・想ひ人と比較：実務支援やAI案内は既存。同じ作業・条件で比べる。')}</li><li>${say('Compare Oyako insurance and optional nature respite as separate candidates; no final business is selected.','Oyako保険・選択制の自然レスパイトも別候補として比較。最終事業は未選択。')}</li></ul><div class="link-row">${nodeButton('NS5')}${nodeButton('NS6')}${nodeButton('O1')}${nodeButton('S2')}${s4Sources(['C05','N01','N02','N03'])}</div></div></details></section>`;}
function s27ImpactHTML(){return `<section class="section" id="impact-framework" aria-labelledby="impact-title">${s4Head('03B · IMPACT FRAMEWORK','Count change, not only activity','活動の数と、本人の変化を分けて測る','Candidate measures for a future pilot. All outcomes and long-term effects below are not yet measured.','今後の試行に向けた測定候補。以下の成果・長期効果はいずれも未測定。','impact-title')}<div class="s27-grid"><div class="s27-card"><h3>Outputs · ${say('Activity','活動実績')}</h3><p>${say('Contacts, conversations and plans produced. Keep these separate from changes in people’s lives.','接点・対話・作成した案の数。生活の変化と分けて記録する。')}</p></div><div class="s27-card"><h3>Outcomes · ${say('Change','本人の変化')}</h3><p>${say('Recognition, wanted consultation, clarified options, completed actions and sustained support.','気づき、望む相談、選択肢の整理、行動完了、支援の継続。')}</p></div><div class="s27-card"><h3>Impact · ${say('Long-term effect','長期的な影響')}</h3><p>${say('Time and emotional burden, access, work-care balance and life satisfaction. Attribution requires stronger evidence.','時間・心理負担、アクセス、両立、生活満足度。因果的な寄与には追加の検証が必要。')}</p></div></div><div class="s27-table-wrap" style="margin-top:18px"><table class="s27-evidence-table"><caption>${say('Stage outcomes · proposed measurement, no results yet','段階別の成果候補・測定計画であり、実績値ではない')}</caption><thead><tr><th>${say('Stage','段階')}</th><th>${say('Outcome KPI candidate','成果KPIの候補')}</th><th>${say('Definition / denominator','測り方・分母')}</th><th>${say('Status','状態')}</th></tr></thead><tbody>${S27_STAGES.map(s=>`<tr><td>${s.n}. ${tx(s.title)}</td><td>${tx(s.outcome)}</td><td>${tx(s.measure)}</td><td>${say('Not yet measured','未測定')}</td></tr>`).join('')}</tbody></table></div><p class="note">${say('Agree time points with participants before a pilot. Record time saved and time added, non-response, service availability and other changes. A small exploratory before/after trial is not proof of social impact. No-contact and listening-only choices remain valid.','試行前に本人と測定時点を合意。減った時間と増えた時間、未回答、支援の空き、他の変化も記録する。少数の探索的な前後比較で社会インパクトを証明しない。連絡不要・傾聴のみも尊重する。')}</p><div class="link-row">${nodeButton('NS3')}${nodeButton('NS4')}${milestoneButton('M07')}</div></section>`;}
function s27EcosystemDetail(){const a=S27_ACTORS.find(a=>a.id===S27.actor);const flows=a.flows.filter(([type])=>S27.edge==='all'||S27.edge===type);return `<article class="s27-edge-detail" id="s27-ecosystem-detail" tabindex="-1"><h3>${tx(a.name)}</h3><p>${tx(a.role)}</p><span class="s27-status">${say('Lab collaboration: not established','Labとの連携：未成立')}</span><div style="margin-top:12px">${flows.length?flows.map(([type,text])=>`<div class="s27-edge-row"><span class="s27-edge-type">${tx(S27_EDGE_TYPES.find(([id])=>id===type)[1])}</span><span>${tx(text)}</span></div>`).join(''):`<p>${say('This simplified map does not assert a flow of the selected type for this actor. Choose another role or “All roles”.','この簡略図では、選択した種類の関係をこの主体には設定していません。別の主体、または「全関係」を選んでください。')}</p>`}</div><div class="link-row">${a.records.map(s4RecordButton).join('')}${a.nodes.map(nodeButton).join('')}</div></article>`;}
function s27EcosystemHTML(){return `<section class="section" id="support-ecosystem" aria-labelledby="support-ecosystem-title">${s4Head('00C · SUPPORT ECOSYSTEM','One family, several routes to support','家族を中心に、複数の支援への接点を見る','Existing roles are shown. Dashed guides are possible relationships, not signed partnerships.','既存の役割を表示。破線は関わり得る経路で、提携実績ではありません。','support-ecosystem-title')}<div class="s27-eco-filters" role="group" aria-label="${say('Relationship type','関係の種類')}">${S27_EDGE_TYPES.map(([id,label])=>`<button type="button" class="btn btn-small" data-s27-edge="${id}" aria-pressed="${S27.edge===id}">${tx(label)}</button>`).join('')}</div><div class="s27-network"><svg class="s27-network-lines" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><path d="M50 50L15 15M50 50L85 15M50 50L15 50M50 50L85 50M50 50L15 85M50 50L85 85"/></svg><div class="s27-network-center">${say('Family Caregiver','家族介護者')}<small>${say('Wishes · consent · changing needs','意思・同意・変わるニーズ')}</small></div>${S27_ACTORS.map(a=>`<button type="button" class="s27-actor ${S27.edge!=='all'&&!a.flows.some(([t])=>t===S27.edge)?'is-muted':''}" data-s27-actor="${a.id}" aria-pressed="${S27.actor===a.id}" aria-controls="s27-ecosystem-detail"><strong>${tx(a.name)}</strong><span>${tx(a.members)}</span>${a.id==='technology'?`<span class="s27-proof hypothesis">${say('Lab functions: proposed','Lab機能は構想')}</span>`:''}</button>`).join('')}</div><p class="s27-scope">${say('Choose a role to see direction, type and conditions below. No confirmed business partners are recorded; interviewed organizations are evidence sources only. Formal institutional roles do not imply that every family uses them.','主体を選ぶと、下に方向・関係・条件を表示。確認済みの事業提携は登録されていません。聞き取り先は根拠の情報源です。既存の役割が、すべての家族に利用されるとは限りません。')}</p>${s27EcosystemDetail()}${s4Sources(['C01','C02','C05','N01','N02'])}</section>`;}
const S27_SLIDES=[{label:B('Vision','ビジョン'),minutes:1},{label:B('Fieldwork','聞き取り'),minutes:2},{label:B('Support model','支援モデル'),minutes:2},{label:B('Evidence gaps','未確認事項'),minutes:2},{label:B('Business & tests','事業・実験'),minutes:2},{label:B('Ask Jeff','Jeffへの相談'),minutes:1}];
function s27SlideHeading(n,en,ja){return `<p class="s27-kicker">SESSION 4 · OCT 28, 2026 · ${n+1} / 6 · ${S27_SLIDES[n].minutes} ${say('MIN','分')}</p><h${n===0?'1':'2'} id="s27-slide-heading">${say(en,ja)}</h${n===0?'1':'2'}>`;}
function s27SlideContent(n){
 if(n===0)return `${s27SlideHeading(0,'Help people turn support into meaningful action','支援につながり、意味のある行動へ')}<p class="s27-vision">${tx(PROJECT.vision)}</p><span class="s27-status">${say('Central research hypothesis · unvalidated','今回の中心仮説・未検証')}</span><p class="s27-lead" style="margin-top:14px">${tx(S27_MESSAGE)}</p><div class="s27-callout"><strong>${say('Research question','研究上の問い')}</strong><p>${say('Which adult caregivers need help recognizing, clarifying or acting on their needs—and what remains beyond existing support?','どの成人介護者が、気づき・整理・実行に支援を必要とし、既存の支援の後に何が残るのか。')}</p></div><p class="s27-scope">${say('Ten transcript records reviewed. They are not ten customer tests. Oyako insurance and nature-based respite remain separate candidates.','議事録10件を照合。顧客テスト10人ではない。Oyako保険・自然レスパイトも別候補として保持。')}</p><div class="s27-links">${s27ResearchLink('overview','Research overview','研究全体を見る')}${s27ResearchLink('care-system','How care works','介護の仕組み')}</div>`;
 if(n===1)return `${s27SlideHeading(1,'Listening changes the starting point','聞くことで、支援の出発点が変わる')}<div class="s27-grid"><article class="s27-card"><p class="s27-proof">${say('PRACTITIONER REPORTS','支援者の報告')}</p><h3>${say('Implementation matters','導入と定着は別')}</h3><p>${say('Oita, Osaka and Yamagata describe problem definition, leadership and sustained use as barriers. Technology alone does not establish family relief.','大分・大阪・山形では、課題認識・経営層・継続運用の障壁。機器導入だけで家族の余裕は立証できない。')}</p><button type="button" class="text-btn" data-s27-record="E02">E02–E03 / E06 ↗</button></article><article class="s27-card"><p class="s27-proof">${say('RELATED / COUNTER PERSPECTIVE','関連する示唆・反対事例')}</p><h3>${say('A request can be unclear','相談内容が決まらない')}</h3><p>${say('Yamanashi describes a need to be heard. Ibaraki describes deeper needs—but also families who already delegate confidently. Unmet need is not universal.','山梨には傾聴への要望。茨城では深いニーズが出る一方、安心して任せられる家族も。全員に不足があるとは限らない。')}</p><button type="button" class="text-btn" data-s27-record="E08">E08–E09 ↗</button></article><article class="s27-card"><p class="s27-proof">${say('NEW · HOKKAIDO · OCT 27','NEW・北海道・10月27日')}</p><h3>${say('Before a request is made','相談が始まる前から')}</h3><p>${say('Young-carer practice highlights unrecognized burden, listening, early trust, outreach and existing resources first. Transfer to adult children needs testing.','ヤングケアラー支援から、負担への気づき・傾聴・平時の信頼・働きかけ・既存資源。成人子への適用は要検証。')}</p><button type="button" class="text-btn" data-s27-record="E10">E10 ↗</button></article></div><div class="s27-callout"><strong>${say('Interpretation → next hypothesis','研究者の解釈 → 次の仮説')}</strong><p>${say('Support may start before a person can name a service need. These differently scoped reports do not demonstrate prevalence, causal effects or paid demand among adult caregivers.','サービスの必要性を言葉にできる前から支援が始まるのではないか。対象の異なる報告で、成人介護者の頻度・因果効果・有料需要は立証できない。')}</p></div>${s27CaseHTML('p')}<div class="s27-links">${s27ResearchLink('findings','All ten evidence records','10件の根拠を確認')}</div>`;

<p><strong>介護があっても、自分らしい人生を諦めなくていい社会。</strong></p>
<p>現在の研究仮説：新たな介護サービスを増やすことよりも、人々が自分のニーズに気づき、既存の支援につながり、それを実際の行動へ変えられるようにすることに、事業機会があるのかもしれない。</p>
<p>照合した議事録は10件。成人した子ども10人の顧客テストではなく、試行の完了結果は未提供。</p>
<h2>北海道の聞き取りから</h2><p>2026年10月27日の北海道ヤングケアラー相談サポートセンターへの聞き取りでは、負担を自覚していない場合、解決策の前の傾聴、平時の信頼、学校への働きかけ、希望と既存資源の確認が語られた。実践経験の要約であり、成人子への一般化や効果測定ではない。</p>
<p>研究者の解釈：明確なサービス依頼の前にも支援が必要かもしれない。新しい仮説：成人介護者にも同じ課題があるか、今後直接確かめる。</p>
<div class="s27-static-stages"><article><h3>1. 気づく</h3><p>負担や支援の必要性に気づく。企業・地域・SNS・イベント等が接点の候補。</p></article><article><h3>2. つながる</h3><p>安心して話せる関係。家族会・相談員・地域との接点。</p></article><article><h3>3. 整理する</h3><p>まず話を聞き、希望と優先事項を言葉にする。AI整理補助は構想。</p></article><article><h3>4. 動く</h3><p>既存制度・サービスを先に確認し、比較・連絡準備・手配を助ける。</p></article><article><h3>5. 続ける</h3><p>同意のもと進み具合を確かめ、必要なら見直す。</p></article></div>
<p>研究者が作成した未検証のモデル案。どの段階から入ってもよい。行動で解決しなければ整理へ、継続確認で変化があれば行動・整理へ戻る。傾聴だけで十分な場合や、追加支援を断る意思を尊重する。販売へ誘導する図ではない。</p>
<h2>何が新しく、誰が払うか</h2><p>本人払い・企業福利厚生・保険会社の付帯支援・行政地域との協力は全て未検証。ケアマネ、地域包括、ツクイ・想ひ人等の既存支援と同じ作業で比べる。AI・継続確認だけで優位とは言わない。Oyako保険・自然レスパイトも候補のまま。</p>

<h2>Jeff教授への相談</h2><ol><li>まず誰に、どの信頼できる経路で話を聞くべきか。</li><li>どの結果が出たら構想を止める・修正するべきか。</li><li>どの業務と支払者を先に検証するべきか。</li></ol>

<details id="static-english" lang="en"><summary>Read the English briefing</summary><h2>From Awareness to Action</h2><p>Vision: A society where care does not mean giving up a life of your own.</p><p>Working hypothesis, not a validated conclusion: The opportunity may not be to create another care service, but to help people recognize their needs, connect with existing support, and turn that support into meaningful action.</p><p>Ten transcript records reviewed are not ten adult-child customer tests. No completed pilot results were supplied.</p><h3>Hokkaido, Oct 27</h3><p>The young-carer practitioner described unrecognized burden, listening before solutions, trust before crisis, school outreach and wishes/existing resources first. These are practitioner accounts, not measured effects. The five-stage model is the researcher’s synthesis; transfer to adult children is untested.</p><div class="s27-static-stages"><article><h3>1. Awareness</h3><p>Notice needs through optional workplace, local and public contact.</p></article><article><h3>2. Trust</h3><p>A safe, low-pressure person or community to talk to.</p></article><article><h3>3. Understanding</h3><p>Listen, articulate concerns and agree priorities. AI support is proposed.</p></article><article><h3>4. Action</h3><p>Check existing services first; prepare contacts and arrangements.</p></article><article><h3>5. Follow-up</h3><p>By consent, check progress and adjust support.</p></article></div><p>Enter at any stage. Action may return to Understanding; Follow-up may return to either. Listening can suffice. Respect declining or stopping support. This is not a sales funnel.</p><h3>New value and payer</h3><p>Family payment, employer benefits, insurer assistance and local/public cooperation are unvalidated hypotheses. Compare the same task with public consultation, care management, Tsukui and Omohibito. AI and follow-up are not automatically an advantage. Oyako insurance and nature respite remain separate candidates.</p><h3>Next evidence</h3><p>Speak directly to current adult caregivers about one recent episode; propose about five consented exploratory cases, including sufficient-support cases, to observe wanted actions and net burden. Recruitment is unconfirmed; no pilot results are registered. Test payer budgets and actual choice separately. Oyako’s affordability, early prepayment and meaningful payout effects are all unvalidated. Stage outcomes and long-term impact are candidate measures, not achievements.</p><h3>Questions for Jeff</h3><ol><li>Whom should I speak to first, and through which trusted route?</li><li>Which result should stop or redirect the concept?</li><li>Which task and payer should be tested first?</li></ol></details>

継続')}</h3><ul><li>${say('Financial need.','経済的な必要性。')}</li><li>${say('Willingness to pay in advance.','事前に保険料を払う意思。')}</li><li>${say('Meaningful impact from benefits.','給付による意味のある効果。')}</li><li>${say('Further investigate how competitors reach customers.','競合が顧客へ届く経路を、さらに調べる。')}</li></ul></article></div>`;
