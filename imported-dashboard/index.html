const N14_LABELS={
 confirmed:B('Confirmed observation','確認できた事実'),partial:B('Partial support','一部裏づけ'),
 untested:B('Untested','未検証'),survey:B('Survey','調査'),case:B('Case','事例')
};
const N14_COLUMNS=[B('Observed problem','確認できた問題'),B('Survey or case result','調査・事例の結果'),B('Population, period and denominator','対象・期間・分母'),B('What this source can tell us','この資料でわかる範囲'),B('Original source','原典')];
const n14Badge=(key)=>`<span class="n14-badge n14-${key}">${tx(N14_LABELS[key])}</span>`;
const n14Arrow=()=>'<span aria-hidden="true"> →</span>';
const n14Jump=(id,en,ja)=>`<a href="#${id}" data-n14-jump="${id}">${say(en,ja)}${n14Arrow()}</a>`;

function n14Source(id){
 const source=N14_SOURCES[id];
 return `<li><a href="${escapeHTML(source.url)}" target="_blank" rel="noopener noreferrer">${tx(source.label)} <span aria-hidden="true">↗</span><span class="n14-sr-only">${say(' (opens in a new tab)','（新しいタブで開きます）')}</span></a></li>`;
}

function n14EvidenceRow(row){
 const fields=[
  `<span class="n14-badges">${n14Badge(row.status)}${n14Badge(row.kind)}</span><strong>${tx(row.problem)}</strong>`,
  `<p>${tx(row.result)}</p>${row.partial?`<p class="n14-subresult">${n14Badge('partial')} ${tx(row.partial.result)}</p>`:''}${row.example?`<p class="n14-subresult">${n14Badge('case')} ${tx(row.example)}</p>`:''}`,
  tx(row.scope),
  `<p>${tx(row.limit)}</p>${row.partial?`<p>${tx(row.partial.limit)}</p>`:''}`,
  `<ul class="n14-sources">${row.sources.map(n14Source).join('')}</ul>`
 ];
 return `<tr id="n14-row-${row.id}" tabindex="-1" role="row">${fields.map((field,i)=>{
  const tag=i===0?'th':'td';
  return `<${tag} ${i===0?'role="rowheader" scope="row"':'role="cell"'}><span class="n14-cell-label" aria-hidden="true">${tx(N14_COLUMNS[i])}</span>${field}</${tag}>`;
 }).join('')}</tr>`;
}

function n14Table(topic){
 const title=`n14-topic-${topic.id}`;
 return `<table class="n14-table" aria-labelledby="${title}" role="table"><colgroup><col><col><col><col><col></colgroup><thead role="rowgroup"><tr role="row">${N14_COLUMNS.map(label=>`<th role="columnheader" scope="col">${tx(label)}</th>`).join('')}</tr></thead><tbody role="rowgroup">${N14_ROWS.filter(row=>row.topic===topic.id).map(n14EvidenceRow).join('')}</tbody></table>`;
}

function n14Topic(topic,i,print){
 const slug=`n14-${topic.id}`, proposal=N14_CANDIDATES.find(c=>c.topic===topic.id);
 const title=`<span class="n14-number" aria-hidden="true">${String(i+1).padStart(2,'0')}</span> ${tx(topic.title)}`;
 const near=`<h3 id="n14-topic-${topic.id}">${title}</h3><p class="n14-scene">${tx(topic.scene)}</p>`;
 if(print)return `<div class="n14-print-topic">${near}${n14Table(topic)}</div>`;
 return `<article class="n14-topic" id="${slug}" tabindex="-1">${near}<details class="n14-detail" id="${slug}-table"><summary><span class="n14-show">${say('View evidence','根拠を見る')}</span><span class="n14-hide">${say('Hide evidence','根拠を閉じる')}</span></summary><div class="n14-table-panel">${n14Table(topic)}</div><p class="n14-topic-next">${n14Jump('n14-idea-'+proposal.id,'Related idea and what to test','関連する事業案と、まだわかっていないこと')}</p></details></article>`;
}

function n14Candidate(c,print){
 const topic=N14_TOPICS.find(t=>t.id===c.topic);
 return `<article class="n14-candidate${c.focus?' n14-priority':''}" id="n14-idea-${c.id}" tabindex="-1"><div class="n14-badges">${n14Badge('untested')}${c.focus?`<span class="n14-badge n14-priority-label">${say('First setting to investigate','優先検証候補')}</span>`:''}</div><h4>${tx(c.title)}</h4>${c.focus?`<p class="n14-focus">${tx(c.focus)}</p><p class="n14-caveat">${say('Chosen to make the next test concrete. Relative demand, actual use and payment have yet to be established.','次の検証場面を具体化するための判断。ほかの案より需要が大きいか、使われるか、支払われるかは確認していません。')}</p>`:''}<ul>${c.questions.map(q=>`<li>${tx(q)}</li>`).join('')}</ul>${print?'':`<div class="n14-related"><p><strong>${say('Observed evidence','観察された根拠')}</strong> ${n14Jump('n14-'+topic.id+'-table',topic.title.en,topic.title.ja)}</p><p><strong>${say('Related research','関連する研究')}</strong> ${c.link?`<a href="#${c.link[0]}">${tx(c.link[1])}${n14Arrow()}</a>`:findingButton(c.finding)}</p>${c.nodes.length?`<div class="link-row">${c.nodes.map(nodeButton).join('')}</div>`:''}</div>`}</article>`;
}

function n14EvidenceHTML(print=false){
 const heading=B('Observed problems and evidence','確認できた問題とエビデンス');
 const intro=B('Four ways that daily life or care arrangements can become difficult. The sources show what was observed in the groups and periods studied. Cases show that something happened; they do not tell us how often.','生活や介護の手配で困りごとが生じる4つの場面です。「確認できた」とは、各資料の対象・期間で観察されたことを指します。個別事例は、同じ問題がどのくらい起きるかを示しません。');
 const labels=[['confirmed',B('Observed in the source','資料の対象・期間で確認')],['partial',B('Indirect or limited evidence','仮説を考えるための限定的・間接的な根拠')],['untested',B('Needs a direct test','直接の検証が必要')]];
 return `<section class="${print?'n14-print':'section n14-section'}" id="confirmed-evidence" aria-labelledby="confirmed-evidence-title">
  <header class="n14-heading"><p class="n14-date">${say('EVIDENCE UPDATE','エビデンス更新')} <time datetime="${N14_DATE}">${escapeHTML(formatDate(N14_DATE,true))}</time></p><h2 id="confirmed-evidence-title">${tx(heading)}</h2><p>${tx(intro)}</p></header>
  ${print?'':`<ul class="n14-topics" aria-label="${say('Four topics','4つのテーマ')}">${N14_TOPICS.map((t,i)=>`<li><a href="#n14-${t.id}" data-n14-jump="n14-${t.id}"><span class="n14-number" aria-hidden="true">${String(i+1).padStart(2,'0')}</span><strong>${tx(t.title)}</strong><span class="n14-topic-arrow" aria-hidden="true">↘</span></a></li>`).join('')}</ul>`}
  <ul class="n14-legend" aria-label="${say('Evidence labels','エビデンスの区分')}">${labels.map(([key,meaning])=>`<li>${n14Badge(key)} <span>${tx(meaning)}</span></li>`).join('')}</ul>
  <div class="n14-theme-list">${N14_TOPICS.map((t,i)=>n14Topic(t,i,print)).join('')}</div>
  <div class="n14-ideas" id="n14-ideas"><h3>${say('Ideas still to test','未検証の仮説と事業案')}</h3><p>${say('The studies and cases point to situations to investigate. They do not establish demand, willingness to pay or the effect of a new service.','調査や事例は、次に調べる場面を絞るために使います。事業案の利用意向、支払意向、効果は確認していません。')}</p><div class="n14-candidate-grid">${N14_CANDIDATES.map(c=>n14Candidate(c,print)).join('')}</div></div>
 </section>`;
}

 const report=document.createElement('div');
 report.innerHTML=html.replace('</header>',`</header>${s27PrintClean(n14EvidenceHTML(true))}`);
 report.querySelectorAll('[data-n14-jump]').forEach(link=>link.closest('.n14-backlink')?.remove());
 return report.innerHTML;

document.addEventListener('click',event=>{
 const link=event.target.closest('[data-n14-jump]');
 if(!link||event.defaultPrevented||event.button!==0||event.metaKey||event.ctrlKey||event.shiftKey||event.altKey)return;
 const target=byId(link.dataset.n14Jump);
 if(!target)return;
 event.preventDefault();
 if(target.tagName==='DETAILS')target.open=true;
 if(target.classList.contains('n14-topic'))target.querySelector('details').open=true;
 revealElement(target.tagName==='DETAILS'?target.querySelector('summary'):target);
});

render();

if((n14InitialTarget==='confirmed-evidence'||n14InitialTarget.startsWith('n14-'))&&byId(n14InitialTarget))s27Research(n14InitialTarget);
