function overviewHTML(){return `<section id="overview" aria-labelledby="project-title"><p class="eyebrow">${PROJECT.eyebrow}</p><h1 id="project-title">${tx(PROJECT.title)}</h1><p class="hero-subtitle">${tx(PROJECT.subtitle)}</p><div class="hero-meta"><span class="phase-label">${tx(PROJECT.phase)}</span><span>${tx(UI.updated)} <time datetime="${PROJECT.baseline}">${escapeHTML(formatDate(PROJECT.baseline,true))}</time></span><span>${tx(UI.meeting)}</span></div><p class="vision">${tx(PROJECT.vision)}</p><div class="executive" aria-label="${say('Executive snapshot','要点')}">${PROJECT.narrative.map(n=>`<div class="exec-row"><h2>${tx(n.title)}</h2><p>${tx(n.text)}</p></div>`).join('')}</div><div class="metrics" aria-label="${say('Research activity counts as of October 15','10月15日時点の調査活動件数')}">${METRICS.map(m=>`<div class="metric"><strong>${m.value}</strong><span>${tx(m.label)}</span><em>${tx(m.note)}</em></div>`).join('')}</div><p class="small muted">${say('Activity counts only; these are not validated outcomes or a representative survey sample.','活動の件数であり、検証済みの成果や代表性のある調査のサンプル数ではありません。')}</p><aside class="callout" aria-labelledby="gap-title"><h3 id="gap-title">${say('The critical evidence gap','最も重要な根拠の不足')}</h3><p>${tx(PROJECT.gap)}</p></aside><details class="inline-details" id="project-purpose"><summary>${say('Mission, research goal & current status','ミッション・研究目的・現在の状態')}</summary><div class="details-body"><dl class="definition"><dt>${tx(UI.mission)}</dt><dd>${tx(PROJECT.mission)}</dd><dt>${tx(UI.goal)}</dt><dd>${tx(PROJECT.goal)}</dd><dt>${tx(UI.status)}</dt><dd>${tx(PROJECT.status)}</dd></dl></div></details></section>`;}
function findingsHTML(){return `<section class="section" id="findings" aria-labelledby="findings-title"><div class="section-head"><div><p class="section-label">01 · ${say('EVIDENCE SO FAR','これまでの調査')}</p><h2 id="findings-title">${say('What the fieldwork suggests','フィールドワークから見えたこと')}</h2><p class="prose muted">${say('Four preliminary insights to investigate. None is a validated general conclusion.','次に確かめるべき4つの初期の示唆。一般的な結論として実証されたものではありません。')}</p></div></div><div class="finding-grid">${FINDINGS.map(f=>`<article class="finding-card" id="finding-${f.id}" tabindex="-1" aria-labelledby="finding-title-${f.id}"><div class="finding-top"><span class="id">${f.id}</span>${badge(f.id==='F4'?UI.idea:UI.initial,'initial')}</div><h3 id="finding-title-${f.id}">${tx(f.title)}</h3><p>${tx(f.claim)}</p><details id="finding-detail-${f.id}"><summary>${tx(UI.detail)}</summary><div class="finding-detail"><h4>${tx(UI.evidenceType)}</h4><p>${tx(f.type)}</p><h4>${tx(UI.openQuestion)}</h4><p>${tx(f.question)}</p><h4>${tx(UI.source)}</h4><div class="link-row">${f.sources.map(pastButton).join('')}</div><h4>${tx(UI.linked)}</h4><div class="link-row">${f.links.map(l=>nodeButton(l.id,raw(l.kind))).join('')}${f.id==='F3'?`<button type="button" class="text-btn" data-action="adjacent">${say('Explore the adjacent provider question','隣接する事業所の課題を見る')}</button>`:''}</div><p class="small muted" style="margin-top:14px">${tx(f.caveat)}</p></div></details></article>`).join('')}</div><details class="inline-details" id="fieldwork-history"><summary>${say('Completed activities & source context','実施済みの活動と情報源')} <span class="small muted">${say('Sep 27 – Oct 15','9月27日〜10月15日')}</span></summary><div class="details-body"><p class="small muted">${say('Participants are identified by role only. These are paraphrased summaries, not verbatim quotes or official organizational positions.','参加者は役割で表記。内容は要約であり、逐語引用や組織の公式見解ではありません。')}</p><ol class="history">${FIELDWORK.map(f=>`<li id="${f.id}" tabindex="-1"><time datetime="${f.date}">${escapeHTML(formatDate(f.date))}</time><div><h3>${tx(f.name)}</h3><p>${tx(f.focus)}</p>${badge(UI[f.state],f.state==='preparing'?'plan':'done')}</div></li>`).join('')}</ol></div></details><div class="note"><h3>${say('Working implication · analysis, not a verified finding','現時点の示唆・検証済みの知見ではなく分析')}</h3><p>${tx(PROJECT.implication)}</p></div><details class="inline-details" id="adjacent-scope"><summary>${say('Alternative scope under consideration','別の研究範囲として検討中の問い')}</summary><div class="details-body"><h3>${say('Why do care providers struggle to sustain operational improvements after adopting technology?','なぜ介護事業所は、技術導入後の業務改善を継続しにくいのか。')}</h3><p class="prose">${say('F3 suggests a provider-side question about problem recognition, leadership, frontline ownership, and sustained improvement. It remains an adjacent exploration, rather than a third main Issue Tree.','F3からは、課題認識、経営層の姿勢、職員の主体性、改善の継続という事業所側の問いが生まれた。現時点では隣接領域の探索であり、3本目の主たるIssue Treeではない。')}</p><p class="prose">${say('Whether provider improvement reduces family caregivers’ time or emotional burden is still unknown.','事業所の改善が、家族介護者の時間的・精神的負担を軽くするかは、まだ分かっていない。')}</p><div class="link-row">${['I04','I05','I06'].map(interviewButton).join('')}</div></div></details></section>`;}
function nodeHTML(n){return `<details class="branch" id="node-${n.id}"><summary><span class="branch-title"><span class="node-id">${n.id}</span>${tx(n.title)}</span>${badge(UI.unvalidated)}<span class="sr-only">${say(' — show hypothesis and validation',' — 仮説と検証を表示')}</span></summary><div class="branch-content"><div class="branch-claim"><div class="field-label">${tx(UI.hypothesis)}</div><p class="claim">${tx(n.claim)}</p><div class="evidence-line"><div class="field-label">${tx(UI.evidence)}</div><p>${tx(n.evidence)}</p>${n.findingIds.length?`<div class="link-row">${n.findingIds.map(findingButton).join('')}</div>`:''}</div>${n.factors?`<details class="nested" id="financial-factors"><summary>${tx(UI.financialFactors)}</summary><dl>${n.factors.map(f=>`<dt>${tx(f.title)}</dt><dd>${tx(f.text)}</dd>`).join('')}</dl></details>`:''}</div><aside class="validation-panel" aria-label="${tx(UI.validation)} ${n.id}"><div class="field-label">${tx(UI.questionsLabel)}</div><p>${tx(n.question)}</p><div class="field-label">${tx(UI.activity)}</div><p>${tx(n.activity)}</p><div class="field-label">${tx(UI.target)}</div><p>${tx(n.target)}</p><div class="link-row"><button type="button" class="text-btn" data-action="recruit">${tx(UI.recruit)}</button>${milestoneButton(n.milestoneId,UI.checkpoint)}</div>${n.interviewIds.length?`<div class="field-label">${tx(UI.linkedInterviews)}</div><div class="link-row">${n.interviewIds.map(interviewButton).join('')}</div>`:`<p class="small muted" style="margin-top:14px">${say('No scheduled interview substitutes for direct family-caregiver evidence.','予定済みの専門職調査だけでは、家族本人の一次情報を補えません。')}</p>`}</aside></div></details>`;}
function treesHTML(){return `<section class="section" id="issue-trees" aria-labelledby="trees-title"><div class="section-head"><div><p class="section-label">02 · ${say('THE TWO PROBLEM FRAMINGS','2つの課題の捉え方')}</p><h2 id="trees-title">${say('Two preliminary Issue Trees','2本の暫定Issue Tree')}</h2><p class="prose tree-intro">${say('A examines the burden itself. B examines why existing support falls short. All ten hypotheses remain unvalidated.','Aは負担そのもの、Bは既存支援が十分に機能しない理由を扱います。10の仮説は、すべて未検証です。')}</p></div></div><div class="tree-tabs" role="tablist" aria-label="${say('Choose an Issue Tree','Issue Treeを選ぶ')}">${TREES.map(t=>`<button type="button" class="tree-tab" id="tab-${t.id}" role="tab" data-tree="${t.id}" aria-controls="tree-${t.id}" aria-selected="${state.tree===t.id}" tabindex="${state.tree===t.id?'0':'-1'}"><span class="tab-id">${say('TREE','ツリー')} ${t.id} · ${tx(t.short)}</span>${tx(t.title)}</button>`).join('')}</div>${TREES.map(t=>`<div role="tabpanel" id="tree-${t.id}" aria-labelledby="tab-${t.id}" ${state.tree!==t.id?'hidden':''}><div class="tree-toolbar"><span class="context">${tx(UI.clickBranch)}</span><button class="btn btn-small" type="button" data-action="expand" data-for-tree="${t.id}">${tx(UI.expand)}</button><button class="btn btn-small" type="button" data-action="collapse" data-for-tree="${t.id}">${tx(UI.collapse)}</button></div><div class="tree-root"><div class="field-label">${say('Overarching issue','全体の問い')} · ${say('Tree','ツリー')} ${t.id}</div><h3>${tx(t.root)}</h3><p class="small">${say('Five provisional branches · explore each below','5つの暫定的な分類・下の項目を開いて確認')}</p></div><div class="branches">${t.nodes.map(nodeHTML).join('')}</div><p class="tree-caveat"><strong>${say('Boundary to discuss:','議論したい境界：')}</strong> ${tx(t.boundary)}</p></div>`).join('')}<details class="inline-details" id="tree-method"><summary>${say('How the two trees relate & how to read the evidence','2本の関係と、根拠の読み方')}</summary><div class="details-body"><p class="prose">${say('Tree A maps sources of burden and outcomes; Tree B maps barriers and shortcomings in support provision and use. They interact and are not perfectly MECE yet. Jeff’s feedback is sought on their boundaries.','Aは負担の原因・結果、Bは支援の提供・利用の障壁や限界を整理する。両者は関係し、完全に重複のない構造ではない。境界の切り方についてJeff教授に助言を求めたい。')}</p><p class="prose">${say('These are exploratory problem trees. A link from a finding or a scheduled interview shows relevance, not validation. Financial hypotheses A3 and B4 still lack family-level confirmation.','これらは探索段階の課題ツリー。知見や予定インタビューへのリンクは関連性を示すもので、仮説の立証を意味しない。経済面のA3・B4も家族単位では未確認。')}</p></div></details></section>`;}
function timelineHTML(){const months=language==='en'?['Sep 26','Oct','Nov','Dec','Jan 27','Feb','Mar','Apr']:['26年9月','10月','11月','12月','27年1月','2月','3月','4月'];return `<div class="timeline-note"><span class="legend-school">${tx(UI.school)}</span><span class="legend-plan">${say('Project planning / tentative dates','自主計画・暫定日程')}</span></div><div class="gantt" aria-label="${say('Monthly roadmap, September 2026 to April 2027','2026年9月から2027年4月の月別ロードマップ')}"><div class="gantt-head"><span style="text-align:left">${say('Milestone · click to read the decision gate','項目を選ぶと、目的と判断事項を表示')}</span>${months.map(m=>`<span>${m}</span>`).join('')}</div>${MILESTONES.map(m=>`<div class="gantt-row"><button type="button" class="gantt-label" data-milestone="${m.id}">${tx(m.title)}<small>${tx(m.date)}</small></button>${months.map((_,i)=>`<span class="gantt-cell" style="grid-column:${i+2}" aria-hidden="true"></span>`).join('')}<button type="button" class="gantt-bar ${m.type.startsWith('school')?'school':''}" style="grid-column:${m.colStart+2} / ${m.colEnd+3}" data-milestone="${m.id}" aria-label="${tx(m.title)} · ${tx(m.date)}">${m.type.startsWith('school')?'◆ ':''}${tx(UI[m.status])}</button></div>`).join('')}</div><div class="mobile-milestones">${MILESTONES.map(m=>`<button type="button" class="milestone-mobile" data-milestone="${m.id}"><span>${m.type.startsWith('school')?'◆ ':''}${tx(m.title)}<small>${tx(m.date)} · ${tx(UI[m.type])}</small></span><span aria-hidden="true">→</span></button>`).join('')}</div>`;}
function researchHTML(){return `<details class="inline-details" id="upcoming-interviews"><summary>${say('9 scheduled interviews · Oct 17–30','予定している9件のインタビュー・10月17〜30日')}</summary><div class="details-body"><p class="small muted">${tx(UI.asOf)} ${say('All nine are scheduled, not conducted. Dates passing will not automatically mark them completed.','9件はいずれも予定・未実施。日付が過ぎても自動で実施済みにはなりません。')}</p><ul class="interviews">${INTERVIEWS.map(i=>`<li class="interview" id="interview-${i.id}" tabindex="-1"><div class="interview-head"><time datetime="${i.date}">${escapeHTML(formatDate(i.date))}</time><div><h3>${tx(i.name)}</h3>${i.qualifier?`<p class="small muted">${tx(i.qualifier)}</p>`:''}<p>${tx(i.focus)}</p>${i.caveat?`<p class="warning-text">${tx(i.caveat)}</p>`:''}<span class="badge badge-plan">${tx(UI.scheduled)}</span></div></div><div class="link-row">${i.nodeIds.map(id=>nodeButton(id)).join('')}${i.findingId?findingButton(i.findingId):''}</div></li>`).join('')}</ul><div class="note" style="margin-top:22px"><p>${say('Professional interviews provide context; they do not replace direct interviews with family caregivers.','専門職への調査は背景理解に役立ちますが、家族介護者本人への直接調査の代わりにはなりません。')}</p></div></div></details><details class="inline-details" id="research-actions"><summary>${say('Research priorities & the remaining pipeline','調査の優先事項と、調整中の案件')}</summary><div class="details-body"><ul class="action-list">${RESEARCH_ACTIONS.map(a=>`<li class="action-item" id="action-${a.id}" tabindex="-1"><div class="action-title"><span class="priority ${a.priority==='critical'?'critical':''}">${say(a.priority==='critical'?'CRITICAL':a.priority==='high'?'HIGH':'MEDIUM',a.priority==='critical'?'最優先':a.priority==='high'?'優先度 高':'優先度 中')}</span><h3>${tx(a.title)}</h3></div><p>${tx(a.text)}</p><p class="action-state">${tx(a.state)}</p></li>`).join('')}</ul><div class="note" style="margin-top:22px"><h3>${say('Additional pipeline · unconfirmed','その他のパイプライン・未確定')}</h3><p>${say('4 scheduling / phone follow-ups and 2 written-questionnaire opportunities. These are not additional confirmed or completed interviews, and no questionnaire responses are counted.','日程調整・電話フォロー4件と、書面質問の機会2件。確定・実施済みのインタビューとして加算せず、書面の回答実績にも含めていません。')}</p></div></div></details>`;}
function roadmapHTML(){const near=[MILESTONES.find(m=>m.id==='M04'),MILESTONES.find(m=>m.id==='M06'),MILESTONES.find(m=>m.id==='M07')];const phaseItems=[['M05',B('Research','調査'),B('Oct–Nov','10〜11月')],['M07',B('Analysis','分析'),B('Iterative · Nov 15','随時・11月15日')],['M08',B('Business design','事業設計'),B('Dec 15','12月15日')],['M09',B('Prototype','試作'),B('Jan 15','1月15日')],['M10',B('Testing','テスト'),B('Feb · tentative','2月・暫定')],['M13',B('Iteration','改善・再検証'),B('Mar–Apr','3〜4月')]];return `<section class="section" id="roadmap" aria-labelledby="roadmap-title"><div class="section-head"><div><p class="section-label">03 · ${say('FROM RESEARCH TO TESTING','調査から検証へ')}</p><h2 id="roadmap-title">${say('Next steps & research roadmap','今後の調査とロードマップ')}</h2><p class="prose muted">${say('Prioritize firsthand caregiver evidence while preparing for the two upcoming seminars.','家族介護者の一次情報を優先しながら、直近の2つのゼミに向けて準備します。')}</p></div></div><div class="dates">${near.map((m,i)=>`<button type="button" class="date-card ${i===2?'plan-date':''}" data-milestone="${m.id}"><time>${i===0?say('Oct 17','10月17日'):i===1?say('Nov 11','11月11日'):say('Nov 15','11月15日')}</time><strong>${tx(m.title)}</strong>${badge(UI[m.type],i===2?'':'plan')}<span class="desc">${i===0?say('Review framing & priorities','課題構造・優先順位を相談'):i===1?say('Preliminary problem + tentative scheme','暫定課題・構想案を提示'):say('Focus the user & unmet need','対象者・未充足ニーズを絞る')}</span></button>`).join('')}</div><div class="note"><h3>${say('The immediate priority: direct family-caregiver interviews','直近の最優先：家族介護者本人への調査')}</h3><p>${tx(RESEARCH_ACTIONS[0].text)}</p><div class="link-row"><button type="button" class="text-btn" data-action="recruit">${say('See recruitment and research actions','募集・調査の行動計画を見る')}</button></div></div>${researchHTML()}<h3 style="margin-top:28px">${say('The long-term work sequence','長期の進め方')}</h3><p class="small muted">${say('Analysis runs throughout discovery. Later dates below are tentative project checkpoints.','分析は調査と並行して行います。後半の日程は自主計画上の暫定的な確認地点です。')}</p><div class="phase-path" aria-label="${say('Six research-to-business phases','調査から事業化に向けた6段階')}">${phaseItems.map(([id,title,date],i)=>`<button type="button" class="phase-step ${i===0?'current':''}" data-milestone="${id}">${tx(title)}<span>${tx(date)}</span></button>`).join('')}</div><details class="inline-details" id="full-roadmap"><summary>${say('Full roadmap · Sep 2026–Apr 2027 · 14 milestones','全体計画・2026年9月〜2027年4月・14項目')}</summary><div class="details-body">${timelineHTML()}<p class="small muted" style="margin-top:18px">${say('The chart positions activities by month; it does not imply exact start/end dates. Early/late February are planning windows. The Joint Seminar date and formal final submission deadline are unconfirmed.','図は月単位の配置であり、厳密な開始・終了日を示しません。2月上旬・下旬は暫定期間です。Joint Seminarの日付と最終提出の正式締切は未確認です。')}</p></div></details><details class="inline-details" id="work-principles"><summary>${say('How the work plan will be used','計画を進めるうえでの考え方')}</summary><div class="details-body"><ol class="prose">${METHODS.map(m=>`<li>${tx(m)}</li>`).join('')}</ol></div></details><details class="inline-details" id="need-selection"><summary>${say('How will I select a meaningful unmet need?','重要な未充足ニーズを、どう選ぶか。')}</summary><div class="details-body"><dl class="definition">${SELECTION_CRITERIA.map(c=>`<dt>${tx(c.title)}</dt><dd>${tx(c.text)}</dd>`).join('')}</dl><p class="warning-text" style="margin-top:20px">${say('Actively seek counterexamples. A respondent mentioning an issue does not by itself prove a hypothesis. No scores have been assigned.','反対事例を積極的に探します。回答者が言及しただけで仮説が立証されたとはしません。点数評価はまだしていません。')}</p></div></details></section>`;}
function futureHTML(){return `<section class="section" id="future-vision" aria-label="${say('Optional future solution exploration','任意で読む将来構想')}"><details class="inline-details vision-details" id="vision-details" style="margin-top:0"><summary><span>${say('Long-term vision & possible solutions','長期ビジョンと、解決策の可能性')}<span class="vision-summary-label">${say('Optional reading · not yet validated · no business model selected','補足・未検証・事業モデルは未選択')}</span></span></summary><div class="details-body">${badge(UI.longTerm,'vision')}<h2 style="font-size:1.4rem;margin-top:18px">${say('A direction to test, not a conclusion','結論ではなく、確かめるための方向性')}</h2><p class="prose">${say('Possible value: rest for the caregiver, with appropriate and trustworthy support for the parent.','提供価値の可能性：家族介護者の休息と、親への適切で信頼できる支援。')}</p><div class="vision-grid">${SOLUTION_VISION.stages.map(s=>`<div class="vision-stage"><div class="field-label">${tx(s.period)}</div><h3>${tx(s.title)}</h3><p>${tx(s.text)}</p></div>`).join('')}</div><div class="note"><h3>${say('The key unknown','特に確かめたいこと')}</h3><p>${tx(SOLUTION_VISION.unknown)}</p></div><p class="small muted" style="margin-top:20px">${tx(SOLUTION_VISION.caveat)}</p><h3 style="margin-top:26px">${say('Solution hypotheses · separate from Trees A / B','解決策の仮説・ツリーA / Bとは区別')}</h3>${SOLUTIONS.map(s=>`<details class="solution" id="node-${s.id}"><summary><span class="id">${s.id}</span><span>${tx(s.title)}</span>${badge(UI.unvalidated)}</summary><div class="field-label">${tx(UI.hypothesis)}</div><p>${tx(s.claim)}</p><div class="field-label">${say('How to test','検証方法')}</div><p>${tx(s.test)}</p><div class="link-row">${(s.interviewIds||[]).map(interviewButton).join('')}${s.milestoneIds.map(id=>milestoneButton(id)).join('')}</div></details>`).join('')}<p class="small muted" style="margin-top:20px">${tx(SOLUTION_VISION.finance)}</p></div></details></section>`;}
function questionsHTML(){return `<section class="section" id="jeff-questions" aria-labelledby="jeff-title"><p class="section-label">04 · ${say('FOR DISCUSSION','相談したいこと')}</p><h2 id="jeff-title">${tx(UI.questions)}</h2><p class="prose muted">${say('Feedback sought on framing, firsthand research, and when to narrow the scope.','課題の捉え方、当事者調査、絞り込むタイミングについて助言を求めたい。')}</p><ol class="question-list">${JEFF_QUESTIONS.map(q=>`<li class="question"><span class="q-number">${q.id}</span><div><p class="field-label">${tx(q.theme)}</p><h3>${tx(q.question)}</h3><p>${tx(q.context)}</p></div></li>`).join('')}</ol><p class="closing">${tx(PROJECT.closing)}</p></section>`;}
function footerHTML(){return `<footer class="site-footer"><div class="wrap footer-row"><p>Shizenkan MBA · Class of 2027 · Volinski Seminar<br>${tx(UI.asOf)} ${say('A view-only research briefing.','閲覧用の研究説明資料。')}</p><a href="#overview">${say('Back to overview ↑','概要へ戻る ↑')}</a></div></footer>`;}
function milestoneHTML(m){const tasks=TREES.flatMap(t=>t.nodes);return `<div class="dialog-head"><div><p class="small muted" style="margin:0">${tx(m.date)}</p><h2 id="milestone-title">${tx(m.title)}</h2><div class="link-row">${badge(UI[m.type],m.type.startsWith('school')?'plan':'')}${badge(UI[m.status],m.status==='completed'?'done':'plan')}</div></div><button type="button" class="btn" data-action="close-modal">${tx(UI.close)}</button></div><div class="dialog-content"><dl class="definition"><dt>${tx(UI.goalLabel)}</dt><dd>${tx(m.goal)}</dd><dt>${tx(UI.activities)}</dt><dd>${tx(m.activities)}</dd><dt>${tx(UI.deliverable)}</dt><dd>${tx(m.deliverable)}</dd><dt>${tx(UI.gate)}</dt><dd>${tx(m.gate)}</dd></dl>${m.nodeIds.length?`<div class="dialog-footer"><h3>${tx(UI.relatedIssues)}</h3><div class="link-row">${m.nodeIds.map(id=>nodeButton(id)).join('')}</div></div>`:''}${m.findingIds?`<div class="dialog-footer"><h3>${tx(UI.findings)}</h3><div class="link-row">${m.findingIds.map(findingButton).join('')}</div></div>`:''}${m.showRecruitment?`<div class="note" style="margin-top:22px"><h3>${say('Priority: firsthand family-caregiver evidence','優先：家族介護者からの一次情報')}</h3><p>${tx(RESEARCH_ACTIONS[0].text)}</p><div class="link-row"><button type="button" class="text-btn" data-action="recruit">${tx(UI.recruit)}</button></div></div>`:''}${m.showInterviews?`<div class="dialog-footer"><h3>${say('Scheduled research · context, not validation','予定している調査・関連情報であり立証ではない')}</h3><div class="link-row">${INTERVIEWS.map(i=>interviewButton(i.id)).join('')}</div></div>`:''}${m.showNodeActivities?`<div class="dialog-footer"><h3>${say('Validation activities from both trees','2本のツリーに対応する検証活動')}</h3><p class="small muted">${say('All are planned. Click a hypothesis to view its full evidence and questions.','いずれも計画。仮説を選ぶと、根拠と検証事項の全文を確認できます。')}</p>${tasks.map(n=>`<div style="border-top:1px solid var(--line);padding:16px 0"><div class="link-row">${nodeButton(n.id)}</div><p class="small" style="margin-top:9px">${tx(n.activity)}</p><p class="small muted">${tx(UI.target)}: ${tx(n.target)}</p></div>`).join('')}</div>`:''}</div>`;}

function render(preserve=false){const opened=preserve?[...document.querySelectorAll('details[id]')].filter(el=>el.open).map(el=>el.id):[];const position=window.scrollY||0;document.documentElement.lang=language;document.title=raw(B('Family Caregiver Research · Session 3','家族介護者支援の研究 · Session 3'));byId('skip-link').textContent=raw(UI.skip);byId('app').innerHTML=headerHTML()+`<main class="wrap" id="main" tabindex="-1">${overviewHTML()+findingsHTML()+treesHTML()+roadmapHTML()+futureHTML()+questionsHTML()}</main>`+footerHTML();for(const id of opened){const el=byId(id);if(el)el.open=true;}if(state.milestone){byId('milestone-dialog').innerHTML=milestoneHTML(MILESTONES.find(m=>m.id===state.milestone));}byId('print-report').innerHTML=buildPrint();if(preserve){window.scrollTo(0,position);} }
function switchLanguage(){language=language==='en'?'ja':'en';try{localStorage.setItem(LANGUAGE_KEY,language);}catch(_){}render(true);if(state.milestone){byId('milestone-dialog').querySelector('[data-action="close-modal"]').focus({preventScroll:true});}else{byId('language-toggle').focus({preventScroll:true});}announce(raw(B('Language changed to English.','表示を日本語に切り替えました。')));}
function selectTree(id,focus=false){if(!TREES.some(t=>t.id===id))return;state.tree=id;for(const tree of TREES){const active=tree.id===id;const tab=byId('tab-'+tree.id);tab.setAttribute('aria-selected',String(active));tab.setAttribute('tabindex',active?'0':'-1');byId('tree-'+tree.id).hidden=!active;}if(focus)byId('tab-'+id).focus();}
function revealElement(el){if(!el)return;let parent=el.parentElement;while(parent){if(parent.tagName==='DETAILS')parent.open=true;parent=parent.parentElement;}el.scrollIntoView({behavior:'auto',block:'start'});el.focus({preventScroll:true});}
function openNode(id){if(!findNode(id))return;closeMilestone(false);if(id.startsWith('S')){byId('vision-details').open=true;}else selectTree(id[0]);const el=byId('node-'+id);el.open=true;el.querySelector('summary').focus({preventScroll:true});el.scrollIntoView({behavior:'auto',block:'start'});announce(id+' · '+raw(findNode(id).title));}
function openFinding(id){closeMilestone(false);const detail=byId('finding-detail-'+id);if(detail)detail.open=true;revealElement(byId('finding-'+id));}
function openInterview(id){closeMilestone(false);byId('upcoming-interviews').open=true;revealElement(byId('interview-'+id));}
function openRecruitment(){closeMilestone(false);byId('research-actions').open=true;revealElement(byId('action-T01'));}
function openMilestone(id,trigger){const m=MILESTONES.find(x=>x.id===id);if(!m)return;state.milestone=id;state.returnFocus=trigger||null;const dialog=byId('milestone-dialog');dialog.innerHTML=milestoneHTML(m);if(!dialog.open)dialog.showModal();dialog.querySelector('[data-action="close-modal"]').focus();}
function closeMilestone(restore=true){const dialog=byId('milestone-dialog');if(!dialog.open){state.milestone=null;return;}const id=state.milestone,trigger=state.returnFocus;state.milestone=null;state.returnFocus=null;dialog.close();if(restore){const target=trigger?.isConnected?trigger:document.querySelector('[data-milestone="'+id+'"]');if(target)target.focus({preventScroll:true});}}
function announce(message){byId('announcer').textContent=message;}
function changeExpansion(id,expanded){const panel=byId('tree-'+id);if(!panel)return;for(const d of panel.querySelectorAll('details'))d.open=expanded;announce(raw(expanded?B('All branches expanded.','すべての項目を開きました。'):B('All branches collapsed.','すべての項目を閉じました。')));}

document.addEventListener('click',event=>{
 const target=event.target.closest('button, a');if(!target)return;
 if(target.dataset.tree){selectTree(target.dataset.tree);return;}
 if(target.dataset.node){openNode(target.dataset.node);return;}
 if(target.dataset.finding){openFinding(target.dataset.finding);return;}
 if(target.dataset.interview){openInterview(target.dataset.interview);return;}
 if(target.dataset.past){closeMilestone(false);byId('fieldwork-history').open=true;revealElement(byId(target.dataset.past));return;}
 if(target.dataset.milestone){openMilestone(target.dataset.milestone,target);return;}
 if(target.dataset.nav){for(const a of document.querySelectorAll('[data-nav]'))a.removeAttribute('aria-current');target.setAttribute('aria-current','location');}
 switch(target.dataset.action){
  case 'language':switchLanguage();break;
  case 'expand':changeExpansion(target.dataset.forTree,true);break;
  case 'collapse':changeExpansion(target.dataset.forTree,false);break;
  case 'close-modal':closeMilestone();break;
  case 'recruit':openRecruitment();break;
  case 'adjacent':byId('adjacent-scope').open=true;revealElement(byId('adjacent-scope').querySelector('summary'));break;
  case 'print':byId('print-report').innerHTML=buildPrint();window.print();break;
 }
});
document.addEventListener('keydown',event=>{const tab=event.target.closest('[role="tab"]');if(!tab||!tab.dataset.tree)return;let id;if(event.key==='ArrowRight'||event.key==='ArrowLeft')id=state.tree==='A'?'B':'A';else if(event.key==='Home')id='A';else if(event.key==='End')id='B';if(id){event.preventDefault();selectTree(id,true);}});
byId('milestone-dialog').addEventListener('cancel',event=>{event.preventDefault();closeMilestone();});
byId('milestone-dialog').addEventListener('click',event=>{if(event.target!==byId('milestone-dialog'))return;const box=event.target.getBoundingClientRect();if(event.clientX<box.left||event.clientX>box.right||event.clientY<box.top||event.clientY>box.bottom)closeMilestone();});
window.addEventListener('beforeprint',()=>{byId('print-report').innerHTML=buildPrint();});
function printField(label,value){return `<p><span class="print-label">${tx(label)}:</span> ${tx(value)}</p>`;}
function printNode(n){return `<article class="print-node"><h3>${n.id} · ${tx(n.title)} ${badge(UI.unvalidated)}</h3>${printField(UI.hypothesis,n.claim)}${printField(UI.evidence,n.evidence)}${n.findingIds.length?printField(UI.linked,n.findingIds.join(', ')):''}${printField(UI.questionsLabel,n.question)}${printField(UI.activity,n.activity)}${printField(UI.target,n.target)}${printField(B('Milestone','関連期限'),B('Nov 15, 2026 · tentative fieldwork synthesis checkpoint','2026年11月15日・自主計画上の暫定的な調査統合期限'))}${n.interviewIds.length?printField(UI.linkedInterviews,n.interviewIds.map(id=>{const i=INTERVIEWS.find(x=>x.id===id);return formatDate(i.date)+' · '+raw(i.name);}).join('; ')):''}${n.factors?`<h4>${tx(UI.financialFactors)}</h4><ul>${n.factors.map(f=>`<li><strong>${tx(f.title)}:</strong> ${tx(f.text)}</li>`).join('')}</ul>`:''}</article>`;}
function buildPrint(){return `<header><p class="print-meta">${PROJECT.eyebrow} · ${tx(UI.printTitle)}</p><h1>${tx(PROJECT.title)}</h1><p>${tx(PROJECT.subtitle)}</p><p class="print-meta">${tx(UI.updated)} ${escapeHTML(formatDate(PROJECT.baseline,true))} · ${tx(UI.meeting)}</p><p><strong>${tx(PROJECT.vision)}</strong></p></header><h2>${tx(UI.overview)}</h2>${PROJECT.narrative.map(n=>printField(n.title,n.text)).join('')}${printField(UI.mission,PROJECT.mission)}${printField(UI.goal,PROJECT.goal)}${printField(UI.status,PROJECT.status)}<table><thead><tr><th>${say('Activity count','活動の区分')}</th><th>${say('Count','件数')}</th><th>${say('Status','状態')}</th></tr></thead><tbody>${METRICS.map(m=>`<tr><td>${tx(m.label)}</td><td>${m.value}</td><td>${tx(m.note)}</td></tr>`).join('')}</tbody></table><p class="print-meta">${say('Activity counts, not validated outcomes or a representative sample.','活動件数であり、検証済みの成果や代表性のあるサンプルではない。')}</p><aside class="print-note"><strong>${say('Critical evidence gap','最も重要な根拠の不足')}</strong><p>${tx(PROJECT.gap)}</p></aside><h2>${tx(UI.findings)}</h2><h3>${say('Completed activities & source context','実施済みの活動と情報源')}</h3><p class="print-meta">${say('Role-based, paraphrased summaries; no verbatim quotes or official organizational positions.','役割で匿名化した要約。逐語引用や組織の公式見解ではない。')}</p>${FIELDWORK.map(f=>`<article class="print-block"><h4>${escapeHTML(formatDate(f.date))} · ${tx(f.name)} — ${tx(UI[f.state])}</h4><p>${tx(f.focus)}</p></article>`).join('')}${FINDINGS.map(f=>`<article class="print-block"><h3>${f.id} · ${tx(f.title)} ${badge(f.id==='F4'?UI.idea:UI.initial,'initial')}</h3><p>${tx(f.claim)}</p>${printField(UI.evidenceType,f.type)}${printField(UI.openQuestion,f.question)}${printField(UI.source,f.sources.map(id=>{const p=FIELDWORK.find(x=>x.id===id);return formatDate(p.date)+' · '+raw(p.name);}).join('; '))}${printField(UI.linked,f.links.length?f.links.map(l=>l.id+' ('+raw(l.kind)+')').join('; '):B('Adjacent provider-productivity question','隣接する事業所の生産性の問い'))}<p class="print-meta">${tx(f.caveat)}</p></article>`).join('')}<div class="print-note"><h3>${say('Analytical implication · not a verified conclusion','分析上の示唆・検証済みの結論ではない')}</h3><p>${tx(PROJECT.implication)}</p></div><article class="print-block"><h3>${say('Alternative scope under consideration','別の研究範囲として検討中の問い')}</h3><p>${say('Why do care providers struggle to sustain operational improvements after adopting technology? This is an adjacent exploration, not a third main tree. Any causal benefit for family caregivers remains unknown.','なぜ介護事業所は技術導入後の業務改善を継続しにくいのか。現時点では隣接領域の探索で、3本目の主たるツリーではない。家族介護者への因果的な利益は未確認。')}</p></article><h2>${say('Two preliminary Issue Trees','2本の暫定Issue Tree')}</h2><p>${say('A maps burden and outcomes; B maps support barriers and shortcomings. They interact, are not yet perfectly MECE, and remain open to Jeff’s feedback. Relevance links do not establish validation.','Aは負担の原因・結果、Bは支援の障壁・限界を整理する。両者は関係し、完全なMECEではない。Jeff教授に助言を求めたい。関連リンクは立証を意味しない。')}</p>${TREES.map(t=>`<h2>${say('Tree','ツリー')} ${t.id} · ${tx(t.title)}</h2><p><strong>${tx(t.root)}</strong></p>${t.nodes.map(printNode).join('')}<p class="print-note">${tx(t.boundary)}</p>`).join('')}<h2>${say('Upcoming research · all scheduled, not completed','今後の調査・すべて予定、未実施')}</h2><p>${tx(UI.asOf)} ${say('Professionals provide context and do not replace family-caregiver interviews.','専門職からの情報は背景理解であり、家族介護者への調査の代わりにはならない。')}</p>${INTERVIEWS.map(i=>`<article class="print-block"><h3>${escapeHTML(formatDate(i.date))} · ${tx(i.name)}${i.qualifier?' ('+tx(i.qualifier)+')':''}</h3><p>${tx(i.focus)}</p>${i.caveat?`<p>${tx(i.caveat)}</p>`:''}<p class="print-meta">${tx(UI.scheduled)} · ${i.nodeIds.length?i.nodeIds.join(', '):i.findingId}</p></article>`).join('')}<h3>${say('Additional research actions','その他の調査行動')}</h3>${RESEARCH_ACTIONS.map(a=>`<article class="print-block"><h4>${tx(a.title)}</h4><p>${tx(a.text)}</p><p class="print-meta">${tx(a.state)}</p></article>`).join('')}<p class="print-note">${say('Unconfirmed pipeline: 4 scheduling / phone follow-ups and 2 written-questionnaire opportunities. No responses are counted.','未確定のパイプライン：日程調整・電話フォロー4件、書面質問の機会2件。回答実績としては加算しない。')}</p><h2>${say('Research-to-business roadmap · Sep 2026–Apr 2027','研究から事業化への計画・2026年9月〜2027年4月')}</h2><p class="print-note">${say('School events and project planning dates are distinct. Intermediate deadlines are tentative. The February Joint Seminar date and formal final submission deadline are not confirmed. Month positions do not imply exact starts or finishes.','学校行事と自主計画の日程は区別。中間期限は暫定。2月のJoint Seminarの日付と、最終提出の正式締切は未確認。月単位の配置は厳密な開始・終了日を示さない。')}</p>${MILESTONES.map(m=>`<article class="print-block"><h3>${tx(m.date)} · ${tx(m.title)}</h3><p class="print-meta">${tx(UI[m.type])} · ${tx(UI[m.status])}</p>${printField(UI.goalLabel,m.goal)}${printField(UI.activities,m.activities)}${printField(UI.deliverable,m.deliverable)}${printField(UI.gate,m.gate)}${printField(UI.relatedIssues,m.nodeIds.join(', '))}</article>`).join('')}<h3>${say('Work-plan principles','進め方の原則')}</h3><ol>${METHODS.map(m=>`<li>${tx(m)}</li>`).join('')}</ol><h3>${say('Selecting a meaningful unmet need','重要な未充足ニーズの選び方')}</h3><ul>${SELECTION_CRITERIA.map(c=>`<li><strong>${tx(c.title)}:</strong> ${tx(c.text)}</li>`).join('')}</ul><p>${say('Actively seek counterexamples; a mention alone does not prove a hypothesis. No scores have been assigned.','反対事例を積極的に探す。言及されたことだけで仮説を立証しない。点数評価はしていない。')}</p><h2>${say('Long-term vision & possible solutions · not yet validated','長期ビジョンと解決策の可能性・未検証')}</h2><p>${say('Possible value: rest for the caregiver with appropriate, trustworthy support for the parent. No business model is selected.','提供価値の可能性：家族介護者の休息と、親への適切で信頼できる支援。事業モデルは未選択。')}</p>${SOLUTION_VISION.stages.map(s=>`<article class="print-block"><h3>${tx(s.period)} · ${tx(s.title)}</h3><p>${tx(s.text)}</p></article>`).join('')}<p class="print-note">${tx(SOLUTION_VISION.unknown)}</p><p>${tx(SOLUTION_VISION.caveat)}</p>${SOLUTIONS.map(s=>`<article class="print-block"><h3>${s.id} · ${tx(s.title)} ${badge(UI.unvalidated)}</h3>${printField(UI.hypothesis,s.claim)}${printField(B('How to test','検証方法'),s.test)}${printField(B('Related milestones','関連マイルストーン'),s.milestoneIds.map(id=>raw(MILESTONES.find(m=>m.id===id).title)).join('; '))}</article>`).join('')}<p>${tx(SOLUTION_VISION.finance)}</p><h2>${tx(UI.questions)}</h2>${JEFF_QUESTIONS.map(q=>`<article class="print-block"><h3>${q.id} · ${tx(q.theme)}</h3><p><strong>${tx(q.question)}</strong></p><p>${tx(q.context)}</p></article>`).join('')}<p class="print-note">${tx(PROJECT.closing)}</p><p class="print-meta">${tx(UI.asOf)}</p>`;}

</script>

 {id:'O1',title:B('An unmet need caused by financial constraints','費用のため必要な支援を買えない層がいる'),claim:B('A defined group of families forgo necessary, available and acceptable support primarily because they cannot afford it.','必要で、利用可能で、本人も受け入れられる支援を、主に経済的な制約で断念する家族層が存在する。'),evidence:B('Provider interviews mention costs and supply constraints; existing private services and insurance have prices and eligibility. No household-level purchase/forgone-service evidence establishes the proposed segment.','専門職から費用や供給の制約が語られ、既存の自費サービス・保険には価格や対象条件がある。ただし、想定顧客の実支出・利用断念の事例による裏付けはまだない。'),unknown:B('Who, what service, how often, at what price, and whether money is the binding constraint rather than fit, supply, trust or preference. A middle-income target is provisional.','誰が、どの支援を、どの頻度・価格で断念するのか。主因は費用か、適合・供給・信頼・希望か。「中間所得層」という対象も暫定。'),activity:B('Reconstruct recent episodes with current family carers. Compare paid and forgone support, disposable budget, parent–child cost sharing, and existing public/employer aid; include families whose needs are already met.','現在介護する家族の直近の場面を再現。購入・断念、家計余力、親子の費用分担、公的・勤務先の支援を確認。既存支援で十分な家族も比較する。'),gate:B('Proceed only if a repeated, consequential and financially addressable problem appears in a specific segment. Revise if cash would not unlock acceptable support.','特定層で繰り返され、生活への影響があり、資金で対処できる課題が見えたら継続。現金があっても利用できないなら仮説を修正する。'),findingIds:['F2','F7'],problemIds:['A3','B3','B4'],milestoneIds:['M15','M07'],sourceIds:['P01','P10'],recordIds:['E01','E04','E06'],status:'unvalidated'},

 {id:'O3',title:B('A payout produces a meaningful life improvement','給付が生活を意味のある程度に変える'),claim:B('The benefit enables actual purchases and arrangements that materially improve a caregiver’s time or emotional space; the difference between ¥1 million and ¥10 million can be explained through real care episodes.','給付により支援の購入・手配が実際に進み、家族の時間や心の余裕が意味のある程度に改善する。100万円と1,000万円の違いを、具体的な介護場面で説明できる。'),evidence:B('There are lump-sum, annual-payment and expense-reimbursement alternatives. Yamagata reported an example of family reassurance from resident care, but no cash-benefit causal test or household time-saving measurement.','一時金・年金・実費補償という既存の選択肢がある。山形では入所者ケアによる家族の安心の例が語られたが、現金給付の効果や家族の時間削減を測定したものではない。'),unknown:B('What is purchased, availability, duration, who receives/controls the money, coordination still needed, and changes in time, sleep, work or worry. The proposal’s payout and price are not designed.','何をどれだけ買うか、手配可能性、持続期間、受取・管理者、残る調整作業、時間・睡眠・仕事・心配の変化。提案商品の給付額・保険料は未設計。'),activity:B('Build individual care budgets using actual quotes and all fees. Compare ¥1m/¥10m scenarios and cash alone vs cash plus arrangement support; observe a small service-use trial and follow up. Define meaningful improvement with users before testing.','実見積りと追加費用を使って個別の介護予算を作る。100万円・1,000万円、現金のみ・手配支援付きで比較し、小規模なサービス利用を観察・追跡。何を意味ある改善とするかは利用者と先に決める。'),gate:B('Continue if support is actually used and a user-defined life outcome improves beyond the existing alternative. Revise if supply, acceptance or coordination prevents conversion to relief.','実際の利用と、既存手段よりよい本人定義の生活変化が見られたら継続。供給・受入れ・調整で休息に転換できなければ見直す。'),findingIds:['F6','F7'],problemIds:['A1','A2','A5','B4','B5'],milestoneIds:['M07','M09','M10'],sourceIds:['P01','P07','P12'],recordIds:['E06'],status:'unvalidated'}

hole-life coverage does not mean unlimited annual payments: ten-payment limit; support-level certification alone does not trigger benefits. Recipient is not automatically the child.','終身保障でも年金は無制限ではなく通算10回。要支援だけでは給付対象外。子が自動的に受け取るものではない。'),overlap:B('Family-arranged preparation and cash for care are established.','家族による備えと介護のための現金給付は既存。'),gap:B('Whether a different recipient, duration or arrangement experience improves outcomes is untested; do not assume these features are absent.','受取人、期間、手配体験を変えることの価値は未検証。他社にない機能と決めつけない。'),sources:['P05','P06','P07','P08']},

const S4_COMP_SUMMARY=B('Existing products already let families prepare for a parent’s care: SBI offers fixed cash, Aflac combines lump sums with limited annual payments, and Sompo’s Oyako no Chikara reimburses the child’s eligible expenses with service/payment connections. “A child pays for a parent’s care” is therefore not a differentiator. Oyako must demonstrate an unmet, financially addressable need, durable willingness to prepay, and meaningful life improvement beyond these alternatives. Whether adding coordination or a better parent–child experience creates an advantage remains untested.','既存商品には、SBIの一時金、アフラックの一時金と回数上限のある年金、親子のちからの子の実費補償とサービス・支払いへの接続がある。「子が親の介護に備える」だけでは差別化できない。Oyakoが成立するには、費用による未充足ニーズ、介護前から払い続ける意思、既存手段より意味のある生活の改善を示す必要がある。調整支援や親子の体験を加えることに優位性があるかも、現時点では未検証である。');

JEFF_QUESTIONS.splice(0,JEFF_QUESTIONS.length,
 {id:'Q1',theme:B('First decisive test','最初に行う重要な検証'),question:B('Which of O1–O3 should I test first to eliminate a weak Oyako direction?','Oyakoの弱い方向を早く見極めるには、O1〜O3のどれから検証すべきか。'),context:B('Financial need, a 20-year payment horizon and life improvement are separate necessary conditions.','費用の必要性、20年先への支払い、生活の改善は別々の必要条件。')},
 {id:'Q2',theme:B('Meaningful differentiation','意味のある差別化'),question:B('What evidence would justify a new offer rather than improving access to existing insurance and care support?','新商品を作ることと、既存保険・介護支援への接続を改善することを、どの根拠で選ぶべきか。'),context:B('Child-arranged parent coverage and child expense reimbursement already exist.','子による親の契約も、子の実費補償も既存。')},
 {id:'Q3',theme:B('Compare business candidates','事業候補の比較'),question:B('Should nature-based respite remain a parallel small test while the insurance conditions are examined?','保険の成立条件を調べる間、自然を活用したレスパイトを小さな並行検証として残すべきか。'),context:B('Compare observed value, user choices and feasibility; no preferred business has been selected.','観察した価値、利用者の選択、実現可能性を比較。最適な事業は未選択。')}

headerHTML=function(){const items=[['overview',B('Overview','概要')],['care-system',B('Care system','業界の仕組み')],['care-journey',B('Family journey','家族の経路')],['structural-gaps',B('Possible gaps','残る課題')],['findings',B('Evidence','調査の根拠')],['oyako-tree',B('Solution tree','解決策の条件')],['competition',B('Insurance comparison','保険の比較')],['issue-trees',B('Problem trees','課題ツリー')],['roadmap',B('Next tests','次の検証')]];return `<header class="site-top"><div class="wrap top-row"><div class="brand"><span class="brand-mark" aria-hidden="true">S4</span><span>Shizenkan MBA<br>${say('Caregiver research','家族介護者支援の研究')}</span></div><div class="top-actions"><button class="btn btn-primary" id="language-toggle" type="button" data-action="language" lang="${language==='en'?'ja':'en'}" aria-label="${say('Switch to Japanese','英語に切り替える')}">${language==='en'?'日本語':'English'}</button><button class="btn" type="button" data-action="print" aria-label="${tx(UI.print)}"><span class="print-label">${tx(UI.print)}</span><span class="mobile-print" aria-hidden="true">PDF</span></button></div></div></header><div class="nav-shell"><nav class="wrap section-nav" aria-label="${say('Briefing sections','資料のセクション')}">${items.map(([id,label])=>`<a href="#${id}" data-nav="${id}">${tx(label)}</a>`).join('')}</nav></div>`;};

 {id:'person',name:B('Older person receiving care','介護を受ける高齢者'),role:B('Their wishes, abilities and consent guide support. They receive care and usually owe the service copay; family funding can differ.','本人の希望・能力・同意を起点にする。介護を受け、通常は利用者負担を支払う立場。家族内の資金分担は別。'),sources:['C01','C02']},

 {id:'center',name:B('Community support center','地域包括支援センター'),role:B('A local general consultation gateway for older people and families. Contact the center responsible for the parent’s residence. It connects to care management and other local support; it may be municipally operated or commissioned.','高齢者と家族の総合相談窓口。親の居住地を担当するセンターへ。ケアマネジメントや地域支援につなぐ。自治体の直営・委託がある。'),sources:['C02','C05']},
 {id:'manager',name:B('Care manager / care planning','ケアマネジャー・ケアプラン'),role:B('Assesses needs and preferences, plans and coordinates support. Care-level users use home-care management; support-level users can use community-center or other designated preventive-care support. Current home/preventive planning is generally fully covered.','状況と希望を踏まえ、計画・事業所調整を行う。要介護は居宅介護支援、要支援は地域包括等の指定介護予防支援。現行の居宅等の計画作成は原則自己負担なし。'),sources:['C02','C03','C04']},

 {id:'government',name:B('Municipality / prefecture / nation','市区町村・都道府県・国'),role:B('Municipality: public insurer, certification, benefits and local consultation infrastructure. Prefecture: wider-area capacity, workforce and provider support. Nation: legal and remuneration framework. Public funds and premiums support the system; responsibilities vary by service.','市区町村：保険者・認定・給付・地域の相談基盤。都道府県：広域調整・基盤・人材・事業者支援。国：制度・報酬等の枠組み。公費と保険料で支える。サービスごとの権限の違いがある。'),sources:['C01','C02','C06']},

 {id:'private',name:B('Non-covered service providers','保険外サービス事業者'),role:B('Offer privately paid care, domestic support or coordination outside public benefit scope. Household/contract payer pays the full private price unless separate aid or insurance applies. Availability and scope must be checked.','公的給付の対象外で、自費介護・家事支援・調整等を提供。別の補助や保険がなければ、家計・契約上の支払者が自費料金を負担。空きと範囲は要確認。'),sources:['A01','A02','A03']},

 {id:'productivity',name:B('Provider productivity support','事業者向け生産性向上支援'),role:B('Prefecture-led centers help care providers improve workflows, select and embed technology, and develop staff capability. These are not the family’s community care consultation desk. Subsidies have separate conditions.','都道府県主体の窓口が、事業者の業務改善、技術の選択・定着、人材を支援。家族の介護相談窓口とは利用者・目的が違う。補助金には別の要件がある。'),sources:['C06'],records:['E02','E03','E06']}

function s4SystemView(view){if(view==='money')return `<div class="map-pane" id="map-money"><h3>${say('Public benefits and private contracts are separate flows','公的給付と、民間の契約を分けて見る')}</h3><div class="two-col"><div class="money-block"><h4>${say('Public LTC insurance','公的介護保険')}</h4>${s4MoneyRow(B('Insured people + public funds','被保険者の保険料＋公費'),B('Public LTCI funding','公的介護保険の財源'),B('Public premiums / taxes','公的保険料・税'))}${s4MoneyRow(B('Municipal insurer','市区町村・保険者'),B('Care provider','介護事業所'),B('Generally 70–90% of covered service cost','対象費用の原則7〜9割'))}${s4MoneyRow(B('Service user','利用者'),B('Care provider','介護事業所'),B('Generally 10–30% copay','原則1〜3割の利用者負担'),'user')}<p class="small muted">${say('Ordinary covered services within limits; claims/payment usually pass through a payment body such as Kokuhoren. Public premiums are pooled: not every child pays directly to their parent’s municipality.','限度内の通常の対象サービスを簡略化。審査・支払いは通常、国保連等を経由。公的保険料はプールされ、すべての子が親の市区町村へ直接払うわけではない。')}</p></div><div class="money-block private-block"><h4>${say('Private spending / voluntary insurance','保険外の支出・任意の民間保険')}</h4>${s4MoneyRow(B('Household / payer','家計・支払者'),B('Non-covered provider','保険外事業者'),B('Private service fee','自費サービス料金'),'user')}${s4MoneyRow(B('Policyholder / payer','契約者等・支払者'),B('Private insurer','民間保険会社'),B('Contract premium','契約の保険料'),'private')}${s4MoneyRow(B('Private insurer','民間保険会社'),B('Contract recipient / eligible cost','契約上の受取人・対象実費'),B('Only when conditions are met','契約条件に該当した場合'),'conditional')}<p class="small muted">${say('A child does not automatically receive the benefit. Direct provider payment exists in some contracts; it is not the universal flow.','子が自動的に保険金を受け取るとは限りません。事業者への直接払いを認める商品もありますが、共通の仕組みではありません。')}</p></div></div><div class="note"><p>${say('Current home/preventive-care plan preparation is generally fully covered. Meals, accommodation, non-covered costs and above-limit spending follow separate rules; relief may apply. Not 10–30% of every expense.','現行の居宅介護支援等の計画作成は原則自己負担なし。食費・居住費・保険外費用・限度額超過は別の体系で、軽減制度がある場合もあります。すべての支出が1〜3割ではありません。')}</p></div><details class="inline-details" id="money-exceptions"><summary>${say('Payment exceptions and future reform','支払いの例外と、今後の制度改正')}</summary><div class="details-body"><p>${say('Some equipment purchases and home adaptations use reimbursement after initial full payment, with local alternatives. Enacted 2026 reforms include future care-home planning categories; their phased commencement and detailed conditions must not be applied as current universal fees.','福祉用具購入・住宅改修等には、いったん全額払う償還払いと自治体ごとの別方式もあります。2026年成立の改正には将来の施設向け計画支援区分等が含まれますが、段階的な施行・詳細条件を、現在の一律負担として適用しません。')}</p>${s4Sources(['C02','C04','C08'])}</div></details>${s4Sources(['C01','C02','C04','P03','P07','P12'])}</div>`;
if(view==='providers')return `<div class="map-pane" id="map-providers"><h3>${say('Two different support systems','名前の似た窓口でも、支える相手が違う')}</h3><div class="support-lane"><span class="lane-label">${say('For care providers','事業者向け')}</span><div class="service-chain">${s4ActorButton('government',B('Prefecture-led programs','都道府県主体の施策'))}${s4Arrow(B('Establish / promote','設置・推進'))}${s4ActorButton('productivity',B('Workflow / training / implementation','業務改善・研修・導入定着'))}${s4Arrow(B('Ongoing improvement support','改善を続けるための支援'))}${s4ActorButton('provider',B('Provider teams and managers','現場職員・管理者'))}</div></div><div class="support-lane family-lane"><span class="lane-label">${say('For older people and families','高齢者・家族向け')}</span><div class="support-pair">${s4ActorButton('center',B('Care consultation and local connections','介護の相談・地域への接続'))}${s4ActorButton('employer',B('Work–care compatibility for employees','働く家族の両立支援'))}</div></div><p class="map-caption">${say('Provider efficiency → family relief is a research question. The arrow is not assumed or measured in these interviews.','事業所の効率化 → 家族の余裕、という経路は研究上の問い。今回の聞き取りで、その効果を測定したわけではありません。')}</p><div class="link-row">${findingButton('F3')}${s4RecordButton('E06')}</div>${s4Sources(['C06','C07'])}</div>`;
return `<div class="map-pane" id="map-services"><div class="people-pair">${s4ActorButton('person',B('Wishes · consent · receives care','希望・同意・介護を受ける'))}${s4ActorButton('family',B('Cares · discusses · coordinates','介護・相談・調整'))}</div><p class="map-bridge">${say('Consultation, preferences and changing needs connect the person/family with this network.','本人・家族が、相談・希望・状況の変化を通じて支援のネットワークにつながる。')}</p><div class="service-chain">${s4ActorButton('center',B('First consultation / local support','総合相談・地域への接続'))}${s4Arrow(B('Introduce / connect','紹介・接続'))}${s4ActorButton('manager',B('Plan and coordinate','計画・事業者調整'))}${s4Arrow(B('Coordinate / review','調整・見直し'))}${s4ActorButton('provider',B('Home visits · day care · short stays','訪問・通所・短期入所等'))}</div><div class="map-return">${say('Care and reports return to the person and family; changing needs return to consultation and planning.','事業所は本人へ介護を提供し、家族等と状況を共有。変化があれば相談・計画へ戻る。')}</div><div class="ecosystem-extra">${s4ActorButton('government',B('Certification · public funding · rules','認定・公的財源・制度'))}${s4ActorButton('private',B('Privately paid care / coordination','自費の介護・調整支援'))}${s4ActorButton('employer',B('Work–care support','仕事と介護の両立支援'))}${s4ActorButton('tech',B('Systems / equipment to providers or homes','事業者・家庭へシステムや機器'))}${s4ActorButton('insurer',B('Contract cash / reimbursement','契約による給付・実費補償'))}</div><p class="map-caption">${say('A relationship map, not a mandatory route. Direct applications, facility inquiries and non-certified community/private support also exist. Select a card for its role. Money is shown separately.','関係図であり、必須の順序ではありません。直接申請、施設への相談、認定を経ない地域・自費支援もあります。カードで役割を確認でき、費用は別の表示に分けています。')}</p>${s4Sources(['C01','C02','C03','C05','C07'])}</div>`;}
function s4SystemHTML(){const tabs=[['services',B('Consultation & services','相談・サービス')],['money',B('Who pays whom','お金の流れ')],['providers',B('Provider vs family support','事業者支援と家族支援')]];return `<section class="section" id="care-system" aria-labelledby="system-title">${s4Head('01 · ECOSYSTEM','Understand the system in three views','介護の仕組みを、3つの視点で見る','Consultation, care and money are different relationships.','相談、介護の提供、お金の関係を分けて示します。','system-title')}<details class="inline-details" id="care-glossary"><summary>${say('Four terms before the map','図を見る前の、4つの用語')}</summary><div class="details-body"><dl class="definition"><dt>${say('Public LTC insurance','公的介護保険')}</dt><dd>${say('The municipal insurance system mainly supports eligible care services. It is distinct from a voluntary private cash policy.','市区町村が保険者となり、対象の介護サービス等を支える制度。任意の民間保険とは別の仕組みです。')}</dd><dt>${say('Care/support need certification','要介護・要支援認定')}</dt><dd>${say('Municipal assessment of support needs: support levels 1–2 and care levels 1–5. Eligibility differs by service.','市区町村による支援の必要度の判定。要支援1・2と要介護1〜5があり、使えるサービスには条件があります。')}</dd><dt>${say('Care manager','ケアマネジャー')}</dt><dd>${say('A professional who discusses needs, makes a plan and coordinates suitable support.','状況と希望を聞き、計画を作り、適切な支援を調整する専門職です。')}</dd><dt>${say('Respite / ongoing implementation support','レスパイト・伴走支援')}</dt><dd>${say('Respite gives a caregiver a break. Ongoing implementation support here refers mainly to helping provider teams sustain improvement—different users and purposes.','レスパイトは介護者が一時的に介護から離れて休むこと。今回の伴走支援は主に事業所が改善を続ける支援で、相手と目的が違います。')}</dd></dl>${s4Sources(['C01','C02','C06'])}</div></details><div class="view-switch" role="group" aria-label="${say('Ecosystem view','業界構造の表示')}">${tabs.map(([id,label])=>`<button class="btn btn-small" type="button" data-map-view="${id}" aria-pressed="${state.map===id}">${tx(label)}</button>`).join('')}</div><div id="system-view">${s4SystemView(state.map)}</div><p class="small muted">${say('Author-created synthesis of official sources, checked Oct 22, 2026. A simplified national overview; local conditions differ.','公式資料に基づく研究者作成の簡略図。2026年10月22日確認。個別の地域・利用条件は異なります。')}</p></section>`;}
function s4JourneyDetail(j){return `<div class="journey-detail" id="journey-detail" tabindex="-1" aria-live="polite"><div class="finding-top"><span class="id">${j.id}</span><h3>${tx(j.title)}</h3></div><div class="s4-detail-grid">${s4Field('Family action','家族の行動',j.action)}${s4Field('People involved','関係者',j.actors)}${s4Field('Existing support','既存の支援',j.support)}${s4Field('Potential burden · hypothesis','生じ得る負担・仮説',j.burden)}</div><p class="note">${tx(j.note)}</p><div class="link-row">${j.gaps.map(s4GapButton).join('')}${j.records.map(s4RecordButton).join('')}</div><p class="small muted">${say('Journey burdens are research hypotheses unless explicitly attributed to a report.','段階ごとの負担は、報告として明示したもの以外は研究上の仮説です。')}</p></div>`;}
function s4JourneyHTML(){const phases=[B('Notice & consult','気づく・相談する'),B('Assess & choose','認定・選択する'),B('Use, adjust & live','利用・見直し・暮らし')];return `<section class="section" id="care-journey" aria-labelledby="journey-title">${s4Head('02 · CAREGIVER JOURNEY','A recurring journey, with several entry points','家族の経路は、一本道ではない','Select a stage to see actions, support, possible burden and related evidence.','段階を押すと、行動・既存支援・生じ得る負担・根拠を確認できます。','journey-title')}<div class="journey-columns">${phases.map((p,i)=>`<div class="journey-phase"><h3>${tx(p)}</h3>${S4_JOURNEY.filter(j=>j.phase===i&&j.id!=='J10').map(j=>`<button type="button" class="journey-stage" data-journey="${j.id}" aria-pressed="${state.journey===j.id}" aria-controls="journey-detail"><span>${j.id}</span><strong>${tx(j.title)}</strong></button>`).join('')}</div>`).join('')}</div><div class="journey-branches"><p><strong>${say('Other routes','別の経路')}</strong> ${say('Community prevention and privately paid support may not require certification. Facilities accept direct inquiries. Urgent/discharge-related needs may enter midway.','地域の予防活動や自費支援には認定不要のものもあります。施設への直接相談や、急病・退院をきっかけに途中から始まる場合もあります。')}</p><p><strong>${say('Review loop','見直しの循環')}</strong> ${say('A change at any stage can lead back to consultation, assessment or a new plan.','状態が変われば、どの段階からも相談・認定・計画へ戻ります。')}</p></div><button type="button" class="rest-ribbon" data-journey="J10" aria-pressed="${state.journey==='J10'}" aria-controls="journey-detail"><strong>${say('Rest and a life of one’s own belong across every stage','家族自身の休息と暮らしは、すべての段階で考える')}</strong><span>${say('Explore respite, trusted support and personal choice','レスパイト・安心できる支援・本人の選択を見る')} →</span></button><div id="journey-content">${s4JourneyDetail(S4_JOURNEY.find(j=>j.id===state.journey))}</div>${s4Sources(['C01','C02','C03','C05'])}</section>`;}
function s4GapsHTML(){return `<section class="section" id="structural-gaps" aria-labelledby="gaps-title">${s4Head('03 · STRUCTURAL GAPS','Where might support fail to become relief?','支援が、家族の余裕に変わらないのはどこか','A problem map to test—not a conclusion about all families.','すべての家族についての結論ではなく、これから確かめる課題の地図です。','gaps-title')}<div class="gap-comparison"><div><span class="lane-label">${say('Support itself','支援そのもの')}</span><h3>${say('Is appropriate care available?','適切な支援が存在するか')}</h3><p>${say('Capacity, hours, eligible tasks and fit','量・時間・対象範囲・適合')}</p></div><div><span class="lane-label">${say('Turning support into use','使える支援へつなぐ過程')}</span><h3>${say('Can the family actually use it?','家族が実際に利用できるか')}</h3><p>${say('Find → choose → arrange → coordinate','探す → 選ぶ → 手配する → 連携する')}</p></div></div><p class="callout">${say('Working hypothesis: even if services exist, the effort of using them may leave meaningful burden. We must test this after accounting for existing care management, concierge services and households already well served.','中心仮説：サービスが存在しても、利用までの作業によって大きな負担が残る可能性。既存のケアマネジメント、民間の調整支援、既に十分な支援を受けている家族も確認して検証します。')}</p><div class="gap-list">${S4_GAPS.map(g=>`<details class="inline-details gap-card" id="gap-${g.id}"><summary><span><span class="id">${g.id} · ${tx(g.kind)}</span><strong>${tx(g.title)}</strong></span>${badge(UI.unvalidated)}</summary><div class="details-body"><p>${tx(g.text)}</p>${s4Field('Evidence so far','現在の根拠',g.evidence)}${s4Field('Next test','次の検証',g.test)}<div class="link-row">${g.nodes.map(n=>nodeButton(n)).join('')}${g.records.map(s4RecordButton).join('')}${g.journeys.map(id=>`<button class="text-btn" type="button" data-journey-link="${id}">${id} · ${tx(S4_JOURNEY.find(j=>j.id===id).title)}</button>`).join('')}</div></div></details>`).join('')}</div></section>`;}
function s4FindingCard(f){return `<article class="finding-card" id="finding-${f.id}" tabindex="-1"><div class="finding-top"><span class="id">${f.id}</span>${badge(B('Indication · not validated','示唆・未検証'),'initial')}</div><h3>${tx(f.title)}</h3><p>${tx(f.claim)}</p><details id="detail-${f.id}"><summary>${tx(UI.detail)}</summary><div class="finding-detail">${s4Field('Type','根拠の種類',f.type)}${s4Field('Still unknown','未確認事項',f.question)}<h4>${say('Source conversations','情報源となる聞き取り')}</h4><div class="link-row">${f.sources.map(id=>{const r=S4_RECORDS.find(x=>x.past===id);return r?s4RecordButton(r.id):pastButton(id);}).join('')}</div><div class="link-row">${f.links.map(l=>nodeButton(l.id)).join('')}</div><p class="warning-text">${tx(f.caveat)}</p></div></details></article>`;}
function s4InterviewCard(r){return `<article class="record-card" id="record-${r.id}" tabindex="-1"><details class="inline-details" id="record-detail-${r.id}"><summary><span><span class="id">${r.id} · ${s4Date(r)}</span><strong>${tx(r.role)}</strong><span class="summary-sub">${tx(r.scope)}</span></span>${badge(B('Conducted','実施済み'),'done')}</summary><div class="details-body"><div class="report-row"><span class="report-label">${say('Participant report','聞き取り報告')}</span><p>${tx(r.report)}</p></div><div class="report-row"><span class="report-label">${say('Interpretation','研究者の解釈')}</span><p>${tx(r.implication)}</p></div><div class="report-row unknown-row"><span class="report-label">${say('Not established','未確認事項')}</span><p>${tx(r.unknown)}</p></div><p class="small muted">${tx(r.trace)} · ${say('Private source, paraphrased for this briefing. Not an official organizational position.','非公開の原本からの要約。組織の公式見解ではありません。')}</p><div class="link-row">${r.findings.map(findingButton).join('')}${r.nodes.map(n=>nodeButton(n)).join('')}</div></div></details></article>`;}
const s4FilterText=f=>JSON.stringify(f).toLocaleLowerCase();
function s4EvidenceResults(){const q=state.query.trim().toLocaleLowerCase();const fs=FINDINGS.filter(f=>(!q||s4FilterText(f).includes(q))&&state.evidenceFilter!=='records');const rs=S4_RECORDS.filter(r=>(!q||s4FilterText(r).includes(q))&&state.evidenceFilter!=='findings');return `<p class="small muted" role="status">${say('Showing','表示：')} ${fs.length} ${say('findings','知見')} / ${rs.length} ${say('records','議事録')}</p>${!fs.length&&!rs.length?`<div class="note">${say('No matches. Try a broader term or another filter.','一致する項目がありません。別の語や表示区分をお試しください。')}</div>`:''}${fs.length?`<div class="finding-grid">${fs.map(s4FindingCard).join('')}</div>`:''}${rs.length?`<details class="inline-details" id="interview-records" ${q?'open':''}><summary>${say('Read the source summaries','聞き取りの原本別要約を見る')} · ${rs.length}</summary><div class="details-body">${rs.map(s4InterviewCard).join('')}</div></details>`:''}`;}
findingsHTML=function(){return `<section class="section" id="findings" aria-labelledby="findings-title">${s4Head('04 · EVIDENCE & COUNTER-EVIDENCE','What the interviews support—and leave open','聞き取りから見えたことと、残る問い','Start with the synthesis; open a finding to inspect its sources.','まず統合した知見を示し、必要なときに根拠となる議事録を開きます。','findings-title')}${s4EvidenceLegend()}<div class="synthesis-grid"><article><h3>${say('Recurring themes','共通していたこと')}</h3><p>${say('Oita, Osaka and Yamagata link continued improvement to clear problems, leadership and staff ownership. Adoption is not the same as implementation.','大分・大阪・山形で、課題の明確化、経営層、職員の主体性が継続的改善と関連付けられた。導入と運用定着は別。')}</p></article><article><h3>${say('Differences to preserve','異なる見方・重点')}</h3><p>${say('The municipal interview sees sustainable care with existing services in some cases and questions information volume. Yamagata stresses accessible adoption; paper can still be practical.','自治体では既存支援で両立できる場合もあるという見方と、情報量への問い。山形は導入の入口を重視し、紙が実務に合う場面もある。')}</p></article><article><h3>${say('Still missing','まだ確認できていないこと')}</h3><p>${say('The most important family-side constraint, its prevalence, willingness to pay and whether cash or nature improves life. Professional accounts are not a representative family sample.','家族側の最大の制約と広がり、支払意思、現金や自然が生活を変えるか。専門職の報告は、家族を代表する標本ではない。')}</p></article></div><div class="evidence-tools"><label for="evidence-search">${say('Search evidence in either language','日英どちらの語でも根拠を検索')}<input id="evidence-search" type="search" value="${escapeHTML(state.query)}" placeholder="${say('e.g. privacy, cost, coordination','例：見守り、費用、調整')}" autocomplete="off"></label><label for="evidence-filter">${say('Show','表示区分')}<select id="evidence-filter"><option value="all" ${state.evidenceFilter==='all'?'selected':''}>${say('All','すべて')}</option><option value="findings" ${state.evidenceFilter==='findings'?'selected':''}>${say('Findings','統合した知見')}</option><option value="records" ${state.evidenceFilter==='records'?'selected':''}>${say('Completed interview records','実施済み議事録')}</option></select></label></div><div id="evidence-results">${s4EvidenceResults()}</div><details class="inline-details" id="fieldwork-history"><summary>${say('Earlier research and source reconciliation','以前の研究と、原本との整合')}</summary><div class="details-body"><ul class="history">${FIELDWORK.filter(f=>!f.recordId).map(f=>`<li id="${f.id}"><time>${f.date?escapeHTML(formatDate(f.date)):say('Unconfirmed date','日付未確認')}</time><div><h3>${tx(f.name)}</h3><p>${tx(f.focus)}</p>${badge(UI[f.state]||B('Earlier record','以前の記録'))}</div></li>`).join('')}</ul><p class="note" style="margin-top:22px">${say('The five requested records and two additional transcripts were reviewed. Duplicate Woods-Life files were counted once; question scripts were not counted as interviews. Two transcript dates are unconfirmed. Role labels follow what speakers described, rather than unverified filename titles. Private family histories and identifiable quotes are omitted.','指定の5件と、自治体・当事者支援の追加2件を確認。Woods-Lifeの重複ファイルは1件とし、質問台本は件数に含めません。2件の実施日は未確認。肩書は未確認のファイル名ではなく本人の説明に合わせ、私的な家族歴や個人を特定できる発言は掲載していません。')}</p></div></details><details class="inline-details" id="adjacent-scope"><summary>${say('Provider productivity: retain the boundary','事業所の生産性と、家族側の効果を分ける')}</summary><div class="details-body"><p>${say('The support-center interviews mainly concern provider operations. A reported family-reassurance example is useful context, but it is not evidence that technology or cash generally reduces family time and emotional burden. That link needs a separate test.','支援センターの聞き取りは、主に事業所の運営について。家族の安心につながったという例は参考になりますが、技術や現金が一般に家族の時間・心理的負担を減らす証明ではありません。その経路は別に検証します。')}</p><div class="link-row">${findingButton('F3')}${nodeButton('O3')}</div></div></details></section>`;};
function s4OyakoNode(n){return `<details class="branch oyako-node" id="node-${n.id}"><summary><span class="branch-title"><span class="node-id">${n.id}</span>${tx(n.title)}</span>${badge(UI.unvalidated)}</summary><div class="branch-content"><div class="branch-claim"><div class="field-label">${say('Testable assertion','検証する主張')}</div><p class="claim">${tx(n.claim)}</p><div class="field-label">${tx(UI.evidence)}</div><p>${tx(n.evidence)}</p><div class="link-row">${n.recordIds.map(s4RecordButton).join('')}${n.findingIds.map(findingButton).join('')}</div>${s4Sources(n.sourceIds)}</div><aside class="validation-panel"><div class="field-label">${say('Unknown','未確認事項')}</div><p>${tx(n.unknown)}</p><div class="field-label">${say('Validation activity','検証方法')}</div><p>${tx(n.activity)}</p><div class="field-label">${say('Continue / revise gate','継続・修正の判断基準')}</div><p>${tx(n.gate)}</p><div class="link-row">${n.milestoneIds.map(id=>milestoneButton(id)).join('')}${n.problemIds.map(id=>nodeButton(id)).join('')}</div></aside></div></details>`;}
function s4OyakoHTML(){return `<section class="section" id="oyako-tree" aria-labelledby="oyako-title">${s4Head('05 · SOLUTION HYPOTHESIS TREE','What must be true for Oyako to work?','Oyako保険が成立するには、何が必要か','Jeff’s Session 3 feedback shifts the center from describing problems to testing a concrete solution.','Session 3の助言を受け、課題の説明から、具体的な解決策の成立条件へ重点を移します。','oyako-title')}<div class="tree-root solution-root"><div class="field-label">${say('Oyako Care Insurance · concept, not a product','おやこケア保険・商品ではなく構想')}</div><h3>${say('Advance protection enables adult children to obtain support that meaningfully improves life during a parent’s care.','介護前の備えが、親の介護時に支援の確保と、家族の意味ある生活の改善につながる。')}</h3><p class="small">${say('All three conditions are necessary. None has been validated. Benefit, premium, underwriting and delivery design remain open.','3条件はすべて必要で、いずれも未検証。給付・保険料・引受け・提供体制の設計は未確定です。')}</p></div><div class="solution-branches"><div class="tree-toolbar"><span class="context">${say('Open each condition for evidence, unknowns and a test.','各条件を開くと、根拠・未確認・検証方法を表示します。')}</span><button class="btn btn-small" type="button" data-s4-expand="oyako-branches">${tx(UI.expand)}</button><button class="btn btn-small" type="button" data-s4-collapse="oyako-branches">${tx(UI.collapse)}</button></div><div id="oyako-branches">${OYAKO.map(s4OyakoNode).join('')}</div></div><details class="inline-details" id="payout-scenarios"><summary>${say('¥1 million vs ¥10 million: what would change?','100万円と1,000万円で、何が変わるか')}</summary><div class="details-body"><p class="warning-text">${say('Hypothetical budgets for research, not the proposed policy’s benefit, premium quote, or measured effect. No service price is assumed.','研究用の仮定の予算です。提案保険の給付額・見積り・実測効果ではありません。サービス単価は仮置きしていません。')}</p><div class="scenario-grid"><article><h3>${say('¥1 million','100万円')}</h3><p>${say('Which immediate unmet support can be purchased, for how long, after all extra costs? What remains uncovered?','追加費用を含め、直近のどの未充足支援を、どれだけの期間購入できるか。何が残るか。')}</p></article><article><h3>${say('¥10 million','1,000万円')}</h3><p>${say('Does a longer budget change repeated support, work choices or resilience? Would available providers, consent or coordination still constrain use?','継続的な支援、仕事の選択、備えはどう変わるか。供給・同意・調整の制約は残るか。')}</p></article></div><p class="note">${say('Method: benefit ÷ actual all-in episode cost gives a budget capacity, not hours of wellbeing. Then observe what was actually arranged, used, and changed in the caregiver’s life. Inflation, future prices and suitable coverage must be examined separately.','方法：給付 ÷ 実際の総費用で分かるのは予算上の利用可能量であり、心の余裕の時間ではありません。実際の手配・利用・生活の変化を追います。物価・将来の価格・適切な保障額は別途検討します。')}</p>${nodeButton('O3')}</div></details><details class="inline-details" id="insurance-feasibility"><summary>${say('Necessary business conditions beyond the three customer tests','3つの顧客検証以外にも必要な条件')}</summary><div class="details-body"><p>${say('Risk selection, pricing, lapse behavior, claims triggers, capital, licensing, carrier partnership, distribution cost, consent and privacy must also work. The three tests do not establish insurance-business feasibility; no underwriting or licensing approval has been obtained.','引受け・価格・解約・給付条件・資本・法制度・保険会社との連携・獲得費用・同意・プライバシーも成立させる必要があります。3条件の検証だけで保険事業の実現可能性は確定しません。引受けや事業許可を得たものではありません。')}</p></div></details></section>`;}
function s4ProductDetails(p){return `<details class="inline-details product-details" id="product-${p.id}"><summary><span><strong>${tx(p.name)}</strong><span class="summary-sub">${tx(p.value)}</span></span></summary><div class="details-body"><div class="s4-detail-grid">${s4Field('Target customer','ターゲット顧客',p.customer)}${s4Field('Contractor, insured, payer & recipient','契約者・被保険者・負担者・受取人',p.roles)}${s4Field('Payment trigger','給付条件',p.trigger)}${s4Field('Amount & form','金額・給付形態',p.benefit)}${s4Field('Eligibility & duration','加入条件・期間',p.eligibility)}${s4Field('Strength','既存商品の強み',p.strength)}${s4Field('Limits','制約・要確認',p.limit)}${s4Field('Overlap with Oyako','Oyakoと重なる部分',p.overlap)}</div><div class="callout"><h4>${tx(p.priceState)}</h4><p>${tx(p.price)}</p></div>${s4Field('Possible remaining need · unvalidated','残るニーズの可能性・未検証',p.gap)}<p class="small muted">${say('Checked Oct 22, 2026. Source versions below; terms depend on the actual contract.','確認日：2026年10月22日。資料の版は下の出典で確認できます。実際の契約条件によります。')}</p>${s4Sources(p.sources)}</div></details>`;}
function s4CompetitionHTML(){return `<section class="section" id="competition" aria-labelledby="competition-title">${s4Head('06 · COMPETITIVE REALITY','Parent–child protection already exists','親子で介護に備える商品は、既にある','Compare what is paid, to whom, and what still needs to be arranged.','何が、誰に支払われ、その後どの手配が必要かを比較します。','competition-title')}<div class="note comp-summary"><h3>${say('One-paragraph briefing for Jeff','教授への競合比較サマリー')}</h3><p>${tx(S4_COMP_SUMMARY)}</p></div><div class="product-overview">${S4_PRODUCTS.map(p=>`<article><h3>${tx(p.name)}</h3><p class="product-value">${tx(p.value)}</p><p>${tx(p.short)}</p><button type="button" class="text-btn" data-product="${p.id}">${say('Inspect terms & price context','条件・料金の前提を見る')} →</button></article>`).join('')}</div><div class="table-wrap"><table class="comparison-table"><caption>${say('The main structural difference—not a price ranking','中心となる構造の違い・価格順位ではありません')}</caption><thead><tr><th scope="col">${say('Question','比較すること')}</th><th scope="col">SBI</th><th scope="col">Aflac</th><th scope="col">${say('Sompo','親子のちから')}</th><th scope="col">${say('Oyako concept','Oyako構想')}</th></tr></thead><tbody><tr><th scope="row">${say('Form','給付形態')}</th><td>${say('Fixed lump sum','定額の一時金')}</td><td>${say('Lump sums + annual payments','一時金＋年金')}</td><td>${say('Eligible expense reimbursement','対象となる実費の補償')}</td><td>${say('Not designed','未設計')}</td></tr><tr><th scope="row">${say('Who receives?','誰が受け取るか')}</th><td>${say('Designated recipient; default insured','指定受取人・未指定なら被保険者')}</td><td>${say('Insured in standard individual contract','通常の個人契約は被保険者')}</td><td>${say('Insured child; eligible provider payment possible','被保険者の子・所定の事業者払いも可')}</td><td>${say('Not decided','未確定')}</td></tr><tr><th scope="row">${say('Child preparing for parent?','子が親に備えるか')}</th><td>${say('Possible','可能')}</td><td>${say('Possible','可能')}</td><td>${say('Core purpose','中心となる用途')}</td><td>${say('Overlaps','重複する')}</td></tr><tr><th scope="row">${say('Life improvement proven here?','今回、生活の改善は確認済みか')}</th><td colspan="3">${say('Product terms establish functions; this research has not measured family outcomes from using them.','商品条件は機能の根拠。今回の研究で、各商品の利用後の家族の効果を測定したものではない。')}</td><td>${say('Unvalidated','未検証')}</td></tr></tbody></table></div><p class="small muted">${say('Price examples are not comparable quotations: age, benefits, payment structure and group discounts differ. Aflac’s found price is explicitly historical; Sompo’s example applies only to the specified group.','保険料例は、年齢・保障・給付形式・団体割引が異なり、同条件の見積りではありません。アフラックは過去資料、親子のちからは指定団体の例と明示しています。')}</p><div class="tree-toolbar"><button type="button" class="btn btn-small" data-s4-expand="product-details">${tx(UI.expand)}</button><button type="button" class="btn btn-small" data-s4-collapse="product-details">${tx(UI.collapse)}</button></div><div id="product-details">${S4_PRODUCTS.map(s4ProductDetails).join('')}</div><details class="inline-details" id="other-alternatives"><summary>${say('Insurance is not the only alternative','保険以外の代替手段もある')}</summary><div class="details-body"><div class="s4-detail-grid"><div><h3>${say('Consultation / coordination','相談・調整')}</h3><p>${say('Community support and care management already coordinate care. Tsukui and Omohibito also offer private support; “coordination exists nowhere” is not a valid premise.','地域包括・ケアマネジメントが既に介護を調整。ツクイ・想ひ人等の民間支援もあり、「調整役がない」を前提にしません。')}</p>${s4Sources(['C05','A01','A02'])}</div><div><h3>${say('Actual care / respite','介護の実施・休息')}</h3><p>${say('Public day/short-stay care and privately paid visits can create time. Nature is one possible use of that time, to compare with the person’s own choice.','公的な通所・短期入所や自費訪問が時間を確保する手段。自然はその時間の使い方の一つで、本人が選ぶ休息と比較します。')}</p>${s4Sources(['C02','A03'])}${s4RecordButton('E05')}</div></div><p class="small muted">${say('The Oct 17 competitive study also covered concierge, employer support, non-covered care and nature/rest alternatives. Its strategic scope is retained; older prices and unverified current conditions are not copied as current facts.','10月17日の競合調査にあるコンシェルジュ・勤務先・保険外介護・自然と休息の視点を保持。旧価格や未確認の現行条件は、現在の事実として転記していません。')}</p></div></details></section>`;}
const s4BaseNodeHTML=nodeHTML;
